<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3B33">
<title>Конешеринг · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: stage with a scenario rail on the left and a phone on the right; on phones the app fills the screen and the rail becomes a sheet. */
:root{
  --stage:#E6E8E1; --stage-ink:#1C2622; --stage-mute:#5F6B65; --stage-line:#CDD3CB; --stage-card:#F4F5F0; --stage-accent:#2F6B55;
  --pine:#1F3B33; --pine2:#2F6B55; --ochre:#B7832F; --ochre-soft:#F3E8D3; --ink:#1C2622; --stone:#5E6863; --paper:#F5F5F0; --card:#FFFFFF; --line:#E2E5DF; --red:#B4412F; --mint:#E3EEE8;
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#141A17;--stage-ink:#E6ECE8;--stage-mute:#9AA8A1;--stage-line:#2A3530;--stage-card:#1B2420;--stage-accent:#7FC2A4;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#141A17;--stage-ink:#E6ECE8;--stage-mute:#9AA8A1;--stage-line:#2A3530;--stage-card:#1B2420;--stage-accent:#7FC2A4;color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--stage-ink);font-family:var(--f-body);margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
.stage{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:center;padding-block:24px;padding-inline:24px}
.rail{width:280px;flex:none;display:flex;flex-direction:column;gap:14px;align-self:center}
.rail h1{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.15;text-wrap:balance}
.rail p{margin:0;color:var(--stage-mute);font-size:13.5px;line-height:1.5}
.rail .grp{display:flex;flex-direction:column;gap:2px}
.rail .grp b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--stage-mute);margin:8px 0 4px}
.rail .grp button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:8px;font-size:14px;color:var(--stage-ink)}
.rail .grp button:hover,.rail .grp button:focus-visible{background:var(--stage-card);outline:none}
.rail .grp button.on{background:var(--stage-card);color:var(--stage-accent);font-weight:600}
.rail .ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rail .ctl button{border:1px solid var(--stage-line);background:var(--stage-card);border-radius:999px;padding:7px 12px;font-size:13px}
.rail .ctl button[aria-pressed="true"]{border-color:var(--stage-accent);color:var(--stage-accent);font-weight:600}
.phone{width:413px;height:872px;flex:none;position:relative;border-radius:68px;background:#111214;padding:10px;transform:scale(var(--k,1));transform-origin:center;box-shadow:inset 0 0 0 2px #2E3033,0 0 0 2px #9A9CA0,0 0 0 4px #5C5E62,0 34px 80px rgba(10,25,18,.32)}
.phone:before,.phone:after{content:"";position:absolute;width:4px;border-radius:2px}
.phone:before{left:-7px;top:150px;height:212px;background:linear-gradient(#8E9094 0 32px,transparent 32px 72px,#8E9094 72px 134px,transparent 134px 150px,#8E9094 150px 212px)}
.phone:after{right:-7px;top:236px;height:100px;background:#8E9094}
.phone .app{border-radius:58px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:60;pointer-events:none}
.app:after{content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#1C2622;z-index:60;pointer-events:none}
.app:has(.view>.hero):after{background:#fff}
.sb .ic{display:flex;gap:6px;align-items:center}.sb .ic svg{height:12px;width:auto;display:block}
@media (min-width:761px) and (min-height:501px){html,body{overflow:hidden}.stage{height:100vh;height:100dvh;min-height:0;align-items:center}.rail{align-self:stretch;max-height:100%;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;scrollbar-width:thin;scrollbar-color:rgba(120,130,125,.45) transparent}.rail::-webkit-scrollbar{width:4px}.rail::-webkit-scrollbar-track{background:transparent}.rail::-webkit-scrollbar-thumb{background:rgba(120,130,125,.45);border-radius:4px}.rail::-webkit-scrollbar-button{display:none;height:0}.rail>:first-child{margin-top:auto}.rail>:last-child{margin-bottom:auto}.tabs{padding-bottom:22px}}
@media (min-width:1040px) and (min-height:501px){.stage{position:relative}.rail{position:absolute;left:0;top:0;bottom:0;padding:24px 14px 24px 20px}}
.app{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;display:flex;flex-direction:column;isolation:isolate}
.fab{display:none}
@media (max-width:760px),(max-height:500px){
  .stage{padding:0;display:block;height:100%;height:100dvh}
  body{background:#F4F3EE}
  .phone:has(.tabs[hidden]) ~ .fab{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
  .rail{display:none}
  .rail.open{display:flex;position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:var(--stage);padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);width:auto}
  .phone{width:100%;height:100%;min-height:0;border-radius:0;padding:0;box-shadow:none;transform:none}
  .phone:before,.phone:after,.island,.app:after{display:none}
  .phone .app{border-radius:0}
  .app{border-radius:0}
  .fab{display:block;position:fixed;z-index:40;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#1C2622;color:#fff;border:0;border-radius:999px;padding:8px 13px;font-size:12px;opacity:.85}
}
.tabs[hidden]{display:none!important}
.empty span>svg{width:100%;height:100%;display:block}
.gift-card{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px 22px;color:#fff;background:linear-gradient(135deg,#1F3B33 0%,#2F6B55 60%,#B7832F 140%);min-height:180px;box-shadow:0 10px 30px rgba(31,59,51,.25)}
.grid3 .tap svg{border-radius:12px}
/* phones: the page itself scrolls, so the browser's own bars (address bar, in-app browser toolbar) can collapse and never hide content */
@media (max-width:760px),(max-height:500px){
  html,body{height:auto}
  .stage,.phone{height:auto!important}
  .app{height:auto;min-height:100vh;min-height:100svh;overflow:visible}
  .view{flex:1 0 auto;overflow:visible}
  .tabs{position:sticky;bottom:0;z-index:15}
  .app .sheet-bg,.app .push,.app .confetti{position:fixed}
  .view .hero{min-height:100vh;min-height:100svh;padding-bottom:calc(max(34px,11svh) + env(safe-area-inset-bottom,0px))}
  .view>[style*="height:100%"]{min-height:100vh;min-height:100svh}
  #chatf{position:sticky;bottom:0}
  #msgs{overflow:visible!important}
}

.rail-x,.rail-bg{display:none}
@media (max-width:760px),(max-height:500px){
  .rail-bg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.35)}
  .rail-on .rail-bg{display:block}
  .rail-on .fab{display:none}
  .fab{transition:opacity .2s,transform .2s}
  .fab-hide .fab{opacity:0;transform:translateY(12px);pointer-events:none}
  .app:has(.tabs:not([hidden])) .view{padding-bottom:56px}
  .rail-x{display:block;position:sticky;top:0;margin:-6px -4px 0 auto;width:36px;height:36px;border:0;border-radius:50%;background:rgba(0,0,0,.08);color:inherit;font-size:22px;line-height:36px;padding:0;cursor:pointer;float:right}
}
/* app chrome */
.sb{height:54px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 46px;font-size:16px;font-weight:600;position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none}
.sb.light{color:#fff}
.sb .bat{width:24px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb .bat:after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
@media (max-width:760px),(max-height:500px){.sb{display:none}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.pad{padding:60px 18px 24px}
@media (max-width:760px),(max-height:500px){.pad{padding-top:calc(14px + env(safe-area-inset-top,0px))}}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#66706B;padding:4px 0}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--pine2);font-weight:600}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 0 var(--line);display:grid;place-items:center;flex:none}
.back svg{width:18px;height:18px}
.h1{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.mute{color:var(--stone)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--stone);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 0 var(--line)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;font-weight:600;font-size:16px;background:var(--pine);color:#fff;text-align:center}
.btn.ochre{background:#9A6A1F}
body:has(.sheet-bg) #fab{display:none}
.lock{display:grid;place-items:center;position:absolute;inset:0;background:rgba(20,30,25,.55);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:6px}
.btn.ghost{background:#fff;color:var(--pine);box-shadow:inset 0 0 0 1.5px var(--pine)}
.btn.light{background:rgba(255,255,255,.95);color:var(--pine)}
.btn:disabled{opacity:.45}
.btn:focus-visible,.chip:focus-visible,.tabs button:focus-visible,.back:focus-visible,.tap:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-size:14px;min-height:40px}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff}
.tag{display:inline-block;white-space:nowrap;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;background:var(--ochre-soft);color:#7E5716}
.tag.g{background:var(--mint);color:var(--pine2)}
.tag.r{background:#F6DEDA;color:var(--red)}
.tag.n{background:#EEF0EC;color:var(--stone)}
canvas.pic,img.pic,video.vid{display:block;object-fit:cover;width:100%;border-radius:14px;background:#DDE3DA}
.tap{all:unset;display:block;cursor:pointer;box-sizing:border-box}
.horse-row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.horse-row canvas,.horse-row img{width:96px;height:96px;border-radius:14px}
.price{font-family:var(--f-display);font-weight:700;white-space:nowrap}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv{gap:12px}.kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}.kv .nw{white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .metric b{display:block;font-size:15px;font-family:var(--f-body);margin-top:3px;line-height:1.25}
.rings{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 4px}.rg{width:32%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}.rg b{font-size:12.5px;margin-top:2px}.rg b+span{font-size:11.5px}.rg span{font-size:11.5px;color:var(--stone);line-height:1.25}
.ring{display:block;flex:none}.pass{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}.pass span:nth-child(odd){color:var(--stone)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E9ECE6;border-radius:12px;padding:3px}.seg button{border:0;background:none;padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--stone)}.seg button.on{background:#fff;color:var(--pine);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 0 var(--line)}
.metric b{display:block;font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;margin-top:2px}
.metric span{font-size:12px;color:var(--stone)}
.bar{height:7px;border-radius:4px;background:#E5E8E2;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pine2);border-radius:4px;transition:width .8s ease}
.bar.o i{background:var(--ochre)}
.live{position:relative;border-radius:18px;overflow:hidden;background:#000}
.live canvas,.live video,.live img{display:block;width:100%;height:210px;object-fit:cover}
.live .pan{animation:pan 18s ease-in-out infinite alternate;transform-origin:center}
@keyframes pan{from{transform:scale(1.12) translateX(-4%)}to{transform:scale(1.12) translateX(4%)}}
.badge-live{position:absolute;top:10px;left:10px;background:#C0392B;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:8px;display:flex;gap:6px;align-items:center}
.badge-live:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}
.ov{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:600;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.feed{display:flex;flex-direction:column}
.fe{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.fe:last-child{border-bottom:0}
.fe time{color:#9A6A1F;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.fe.new{animation:slidein .6s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:#fff;border:0;border-radius:16px;padding:12px 4px 10px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.qa svg{width:24px;height:24px;color:var(--pine2)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px}
.opt.on{border-color:var(--ochre);background:#FCF7EE}
.opt ul{margin:8px 0 0;padding-left:18px;color:var(--stone);font-size:13.5px;line-height:1.5}
.sheet-bg{position:absolute;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .25s}
.sheet{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#CDD2CC;margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.push{position:absolute;left:10px;right:10px;top:56px;z-index:30;background:rgba(250,250,247,.97);backdrop-filter:blur(10px);border-radius:20px;padding:12px 14px;box-shadow:0 12px 34px rgba(0,0,0,.18);display:grid;grid-template-columns:36px 1fr;gap:10px;animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}
@media (max-width:760px),(max-height:500px){.push{top:calc(10px + env(safe-area-inset-top,0px))}}
.push .ic{width:36px;height:36px;border-radius:10px;background:var(--pine);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:13px}
.push b{font-size:14px}.push p{margin:2px 0 0;font-size:13.5px;line-height:1.35}
@keyframes drop{from{transform:translateY(-120%)}}
.hero{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 34px;color:#fff;background-size:cover;background-position:center}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,15,.05) 30%,rgba(10,20,15,.82) 100%)}
.hero>*{position:relative}
.logo{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.otp{display:flex;gap:10px}
.otp span{width:56px;height:62px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:24px}
.otp span.f{box-shadow:inset 0 0 0 2px var(--pine2)}
.input{width:100%;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);padding:15px 14px;font:inherit;font-size:17px;color:var(--ink)}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--pine2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.cal .h{font-size:11px;color:var(--stone);padding:4px 0}
.cal button{border:0;background:none;padding:9px 0;border-radius:10px}
.cal button.a{background:var(--mint);color:var(--pine);font-weight:600}
.cal button.x{color:#C2C8C3;cursor:default}
.cal button.s{background:var(--ochre);color:#fff;font-weight:700}
.bub{max-width:78%;padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.4}
.bub.l{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 0 var(--line)}
.bub.r{background:var(--pine);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;text-align:center;font-size:12px;line-height:1.3}
.bdg{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;background:var(--ochre)}
.bdg.g{background:var(--pine2)}
.bdg.off{background:#E1E4DE;color:#6F7873}
.bdg.pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.tog{width:46px;height:28px;border-radius:14px;background:#C9D0CA;border:0;position:relative;flex:none;transition:background .2s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog[aria-checked="true"]{background:var(--pine2)}
.tog[aria-checked="true"]:after{left:21px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lrow:last-child{border-bottom:0}
.chev{color:#A6AEA9}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;font-size:11px;color:var(--stone)}
.bars i{display:block;width:100%;background:var(--pine2);border-radius:6px 6px 2px 2px;transition:height .8s}
.bars i.t{background:var(--ochre)}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:25}
.spin{width:44px;height:44px;border:4px solid var(--mint);border-top-color:var(--pine2);border-radius:50%;animation:rot 0.9s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage">
  <div class="rail-bg" id="railBg"></div>
  <aside class="rail" id="rail" aria-label="Сценарии прототипа">
    <button class="rail-x" id="railX" aria-label="Закрыть меню">×</button>
    <h1>Конешеринг</h1>
    <p>Кликабельный прототип PWA для парк-отеля Marali. Нажимайте прямо на экране телефона или перейдите к сценарию из списка.</p>
    <div class="grp" id="scen"></div>

<script>
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function ridge(W,H,base,amp,rough,seed){const r=rng(seed);const n=257;let pts=new Array(n).fill(0);pts[0]=r();pts[n-1]=r();let step=n-1,a=1;while(step>1){const h=step/2;for(let i=h;i<n;i+=step){pts[i]=(pts[i-h]+pts[i+h])/2+(r()-.5)*a}a*=rough;step=h}
  return pts.map((v,i)=>[i/(n-1)*W, base - v*amp]);}
function fillRidge(c,W,H,pts,col){c.beginPath();c.moveTo(0,H);pts.forEach(p=>c.lineTo(p[0],p[1]));c.lineTo(W,H);c.closePath();c.fillStyle=col;c.fill();}

function horse(c,x,y,s,col,flip,graze){c.save();c.translate(x,y);c.scale(flip?-s:s,s);c.translate(-100,-148);c.fillStyle=col;c.fill(graze?GRAZE:HORSE);c.restore();}
function sky(c,W,H,stops){const g=c.createLinearGradient(0,0,0,H);stops.forEach(([o,col])=>g.addColorStop(o,col));c.fillStyle=g;c.fillRect(0,0,W,H);}
function sun(c,x,y,r,col){const g=c.createRadialGradient(x,y,0,x,y,r*6);g.addColorStop(0,col);g.addColorStop(.15,col.replace(/[\d.]+\)$/,'.55)'));g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(x-r*6,y-r*6,r*12,r*12);c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=col;c.fill();}
function fog(c,W,y,h,a){const g=c.createLinearGradient(0,y-h,0,y+h);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,`rgba(255,250,240,${a})`);g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,y-h,W,h*2);}
function grass(c,W,H,y,col,seed){const r=rng(seed);c.strokeStyle=col;c.lineWidth=1.2;for(let i=0;i<W*0.9;i++){const x=r()*W,yy=y+r()*(H-y),l=6+r()*14*(yy/H);c.beginPath();c.moveTo(x,yy);c.lineTo(x+(r()-.5)*5,yy-l);c.stroke();}}
function pines(c,W,y,col,seed,scale){const r=rng(seed);for(let i=0;i<W/14;i++){const x=r()*W,h=(18+r()*34)*scale,ww=h*.32;c.beginPath();c.moveTo(x,y-h);c.lineTo(x-ww,y+2);c.lineTo(x+ww,y+2);c.closePath();c.fillStyle=col;c.fill();}}

  [[.55,.22,.55,41,'#27364A'],[.65,.16,.5,42,'#1C2837'],[.76,.08,.45,43,'#131C25']].forEach(([b,a,rr,s,col])=>fillRidge(c,W,H,ridge(W,H,H*b,H*a,rr,s),col));
  const fx=W*.58,fy=H*.84;const g=c.createRadialGradient(fx,fy,0,fx,fy,H*.35);g.addColorStop(0,'rgba(255,170,80,.55)');g.addColorStop(1,'rgba(255,150,60,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='#0A0F14';c.fillRect(0,H*.86,W,H*.14);

 <button class="btn ochre" data-yes>Начать курс${S.plan.id==='own'?'':' · 18 000 ₽'}</button><button class="btn" style="background:none;color:var(--stone);margin-top:4px" data-close>Отмена</button></div>`;app.appendChild(bg);
 bg.addEventListener('click',e=>{if(e.target===bg||e.target.closest('[data-close]'))bg.remove();if(e.target.closest('[data-yes]')){bg.remove();S.training=id;if(S.plan.id!=='own')addPay(`Курс «${st[1]}» · ${h.name}`,18000);render();
  setTimeout(()=>notify('Конешеринг',`Курс «${st[1]}» начнётся завтра в 09:00. Тренер Марина пришлёт видео с первого занятия.`),400);
  setTimeout(()=>{const o=hs(h);if(o.training!==id)return;S.boost=S.boost||{};S.boost[h.id+id]=(S.boost[h.id+id]||0)+gain;o.training=null;o.xp=(o.xp??XP0[h.id])+300;if(S.screen==='skills')render();const np=fpct(h,id);notify('Курс завершён',`${h.name}: ${st[1].toLowerCase()} ${id==='jump'?'вырос':'выросла'} до ${fval(h,id)} ${st[2]}. +300 XP`);confetti()},4200)}})}
view.addEventListener('click',e=>{const t=e.target.closest('[data-devtab],[data-train]');if(!t||t.disabled)return;if(t.dataset.devtab){S.devTab=t.dataset.devtab;return render()}if(t.dataset.train)return trainSheet(t.dataset.train)});
view.addEventListener('click',e=>{const t=e.target.closest('button,[data-go]');if(!t||t.disabled)return;const d=t.dataset;
 if('back' in d)return back();
 if(d.go)return go(d.go);
 if(d.tab){S.stack=[];return go(d.tab,false)}
 if(d.filter){S.filter=d.filter;return render()}
 if(d.horse){S.pick=HORSES.find(h=>h.id===d.horse);S.pickPlan=PLANS[S.pick.places?1:2];return go('horse')}
 if(d.plan){S.pickPlan=PLANS.find(p=>p.id===d.plan);return render()}
 if(d.cam){S.cam=d.cam;return render()}
 if(d.staff){S.staffSel=d.staff;return go('staff')}
 if(d.camact){const h=S.horse,n={stall:'Денник',pasture:'Пастбище',arena:'Плац',pov:'Глазами коня'}[S.cam||'pasture'];if(d.camact==='shot'){const l=view.querySelector('.live');if(l){l.animate([{filter:'brightness(2.2)'},{filter:'none'}],{duration:350})}S.shots=(S.shots||0)+1;return notify('Снимок сохранён',`Кадр «${n}» в альбоме «${h.name}». Всего снимков: ${S.shots}.`)}
  if(d.camact==='groom')return notify('Алексей получил просьбу',`Подведёт ${nm('a',h)} к камере «${n}» в ближайшие 15 минут.`);
  if(d.camact==='archive')return notify('Архив камер','Записи за 7 дней: выберите день и время на шкале. В прототипе архив пока не открывается.')}
 if(d.horsepick){useHorse(d.horsepick);S.pick=null;if('stay' in d){scr().scrollTop=0;return render()}S.stack=[];return go('home',false)}
 if('povlock' in d)return notify('Камера «глазами коня»','Она на уздечке и включается на прогулках. Доступна на тарифе «Личный конь».');
 if(d.trip==='tour')return go('tour');
 if(d.trip){S.tripSel=d.trip;S.date=null;S.dep=null;S.ppl=1;return go('book')}
 if(d.dep){S.dep=d.dep;return render()}
 if(d.ppl){S.ppl=Math.max(1,Math.min(4,S.ppl+ +d.ppl));return render()}
 if(d.date){S.date=+d.date;return render()}
 if(d.tog){S.notif[d.tog]=!S.notif[d.tog];return render()}
 if('pm' in d){view.querySelectorAll('[data-pm]').forEach(b=>b.classList.toggle('on',b===t));return}
 const a=d.act;
 if(a==='sendCode')return go('code');
 if(a==='tourBook'){S.tripSel='tour';S.dep=null;S.ppl=1;return go('book')}
 if(a==='start'){S.stack=['welcome'];return go('catalog',false)}
 if(a==='haveHorse'){S.after='home';return go('login')}
 if(a==='toPay'){if(!S.logged){S.after='pay';return go('login')}return go('pay')}
 if(a==='more')return notify('В прототипе 6 коней','В приложении здесь будет весь табун Marali: 150 коней с фильтрами и поиском.');
 if(a==='pay'){const h=ph(),p=pp();go('paying');setTimeout(()=>{if(S.screen!=='paying')return;ensureHerd();saveCur();const ex=S.herd.find(e=>e.horse===h);if(ex)Object.assign(ex,{plan:p,sub:'active'});else S.herd.push({horse:h,plan:p,sub:'active'});if(S.horse!==h){S.learning=null;S.training=null;S.xp=(ex&&ex.xp)??XP0[h.id]}S.horse=h;S.plan=p;S.pick=null;S.pickPlan=null;S.owned=true;S.logged=true;S.sub='active';S.pays=S.pays.filter(x=>!(x.sub&&x.hid===h.id));S.pays.unshift({d:'5 октября',t:`${p.name} · ${h.name}, октябрь`,s:p.price,sub:1,hid:h.id});S.stack=[];go('meet',false);confetti()},1400);return}
 if(a==='toHome'){S.stack=[];go('home',false);setTimeout(()=>{S.feed.push(['09:52',`Видео-приветствие от конюха Алексея и ${S.horse.name}`]);S.feedNew=true;if(S.screen==='home')render();notify('Конешеринг',`${S.horse.name} передаёт привет! Алексей записал для вас видео.`)},2200);return}
 if(d.learn)return learnSheet(d.learn);
 if(d.subfor){useHorse(d.subfor);return subSheet()}
 if(a==='subSheet')return subSheet();
 if(a==='confirmBook'){const C=bookCalc(),n=C.t[0],k=S.tripSel;const when=k==='tour'?`${S.dep} 2027 · ${S.ppl} ${plur(S.ppl,'человек','человека','человек')}`:k==='vip'?`${S.date}–${S.date+2} октября 2026`:`${S.date} октября 2026`;S.bookings.unshift({t:n,d:when+(C.incl?' · входит в тариф':' · '+rub(C.sum)),s:'Ждёт подтверждения',incl:C.incl});if(C.sum)addPay(n,C.sum);S.stack=['trips'];go('bookings',false);notify('Бронь создана',`${n}, ${when}. Менеджер Ольга подтвердит в течение часа.`);return}
});
tabsEl.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){S.stack=[];S.pick=null;S.pickPlan=null;go(t.dataset.tab,false)}});
function bubble(m){const box=$('#msgs');if(!box||S.screen!=='chat')return;const b=document.createElement('div');b.className='bub '+m[0];b.textContent=m[1];box.appendChild(b);box.scrollTop=box.scrollHeight;if(MOB.matches)scr().scrollTop=scr().scrollHeight}
view.addEventListener('submit',e=>{if(e.target.id!=='chatf')return;e.preventDefault();const i=$('#chatIn'),v=i.value.trim();if(!v)return;const m=['r',v];S.chat.push(m);bubble(m);i.value='';i.focus();
 setTimeout(()=>{const r=['l','Принято! Передам Алексею и вернусь с ответом в течение 5 минут.'];S.chat.push(r);bubble(r)},1100)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const sh=app.querySelector('.sheet-bg');if(sh)sh.remove();else if($('#rail').classList.contains('open'))setRail(false)}});

// live day
let liveT=null;function liveTick(){if(!S.owned){S.owned=true}const ev=FEED_LIVE[S.liveIdx%FEED_LIVE.length];S.liveIdx++;S.feed.push([ev[0],ev[1]]);S.feedNew=true;if(S.screen==='home')render();Object.assign(S.st,ev[3]);notify(ev[2],ev[4](S.horse));
 }
$('#liveBtn').addEventListener('click',e=>{S.live=!S.live;e.currentTarget.setAttribute('aria-pressed',S.live);clearInterval(liveT);if(S.live){if(!S.owned)S.owned=true;S.stack=[];go('home',false);setTimeout(liveTick,1200);liveT=setInterval(liveTick,6500)}});
$('#resetBtn').addEventListener('click',()=>{location.reload()});

// scenario rail
const SC=[['Вход',[['welcome','Приветствие'],['login','Вход по SMS']]],['Выбор коня',[['catalog','Каталог и фильтры'],['horse','Карточка коня'],['staff','Конюх и тренер'],['tariff','Выбор тарифа'],['pay','Оплата'],['gift','Подарочный сертификат']]],['Мой конь',[['home','Главная и лента'],['herd','Два коня у владельца'],['cams','Камеры и «глазами коня»'],['report','Ежедневный отчёт'],['stats','Статистика и GPS'],['health','Здоровье и медкарта'],['shop','Магазин для коня'],['purchases','Мои покупки и снаряжение'],['buyout','Выкуп коня']]],['Развитие',[['skills','Тренировки, трюки, ачивки'],['club','Клуб владельцев и рейтинг']]],['Поездки',[['trips','Визиты и тур «Кержаки»'],['tour','Программа тура «Кержаки»'],['bookings','Мои брони']]],['Профиль',[['profile','Подписка и настройки'],['chat','Чат с менеджером'],['notif','Уведомления'],['payments','История платежей']]]];
$('#scen').innerHTML=SC.map(g=>`<b>${g[0]}</b>${g[1].map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('')}`).join('');
$('#scen').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;let s=b.dataset.s;if(s==='herd'){S.owned=true;S.herd=[{horse:HORSES[0],plan:PLANS[1],sub:'active'},{horse:HORSES[1],plan:PLANS[2],sub:'active'}];S.horse=HORSES[0];S.plan=PLANS[1];S.sub='active';S.learning=null;S.training=null;s='home'}if(['home','cams','report','stats','health','skills','shop','purchases','buyout'].includes(s))S.owned=true;if(S.owned||['pay','payments'].includes(s))S.logged=true;if(s==='book'&&!S.tripSel)S.tripSel='tour';if(!['horse','tariff','pay','staff'].includes(s)){S.pick=null;S.pickPlan=null}app.querySelector('.sheet-bg')?.remove();
 const ST={login:['welcome'],horse:['catalog'],staff:['catalog','horse'],purchases:['home','shop'],tariff:['catalog','horse'],pay:['catalog','horse','tariff']};S.stack=ST[s]||(TAB_OF[s]&&TAB_OF[s]!==s?[TAB_OF[s]]:[]);go(s,false);setRail(false)});
let lastY=0;const onScr=()=>{const y=scr().scrollTop;if(Math.abs(y-lastY)<6)return;document.body.classList.toggle('fab-hide',y>lastY&&y>40);lastY=y};view.addEventListener('scroll',onScr,{passive:true});addEventListener('scroll',onScr,{passive:true});
const setRail=o=>{$('#rail').classList.toggle('open',o);document.body.classList.toggle('rail-on',o)};
$('#fab').addEventListener('click',()=>setRail(!$('#rail').classList.contains('open')));
$('#railX').addEventListener('click',()=>setRail(false));
$('#railBg').addEventListener('click',()=>setRail(false));
$('#liveBtn').addEventListener('click',()=>setRail(false));
const fit=()=>document.documentElement.style.setProperty('--k',Math.min(1,(innerHeight-40)/872).toFixed(4));fit();addEventListener('resize',fit);
render();
})();
