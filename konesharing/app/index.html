<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2A2468"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Конешеринг"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Конешеринг</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap">
<style>

/* ---------- цветовые схемы ---------- */
.s4{--f:"Geologica",system-ui,sans-serif;--fd:"Geologica",system-ui,sans-serif;--hw:700;--r:30px;--rb:999px;
 --ink:#221E45;--mute:#625E80;--off:#A7A3C2;--line:rgba(98,94,128,.16);--acc:#2A2468;--lk:#5B4CE6;
 --g1:#FF9A7A;--g2:#7B5CE6;--tint:#F1EDFF;--track:rgba(91,76,230,.12);--gold:#F2A93B;--goldt:#B86E00;--shc:rgba(60,40,140,.45);--top:#2A2468;
 --sky:linear-gradient(180deg,#2A2468 0,#5B4CE6 210px,#C98BD0 360px,#FFD3C2 480px,#F6E9F5 640px,#E9EEFB 1100px,#E3F4EE 1900px,#EFEAFB 100%);
 --skys:linear-gradient(180deg,#2A2468 0,#5B4CE6 160px,#C98BD0 260px,#FFD3C2 340px,#F6E9F5 440px,#E9EEFB 700px,#EFEAFB 100%);
 --deep:linear-gradient(135deg,#2A2468,#5B4CE6 50%,#B45CE0 80%,#FF9A7A);
 --m1a:#9486EF;--m1b:#D0A6DE;--m2a:#7A6BE8;--m2b:#BC93DA;--m3a:#6455DE;--m3b:#A985D6}

.s5{--f:"Geologica",system-ui,sans-serif;--fd:"Geologica",system-ui,sans-serif;--hw:700;--r:30px;--rb:999px;
 --ink:#1F2622;--mute:#5F6657;--off:#A3A08C;--line:rgba(95,102,87,.18);--acc:#052E2A;--lk:#740F03;
 --g1:#B68B58;--g2:#740F03;--tint:#EFE8DA;--track:rgba(5,46,42,.12);--gold:#B68B58;--goldt:#7D4822;--shc:rgba(5,46,42,.42);--top:#052E2A;
 --sky:linear-gradient(180deg,#052E2A 0,#1D4A40 210px,#919179 360px,#D4C9B5 480px,#EDE6D8 640px,#F1ECE2 1100px,#E9ECE3 1900px,#F3EFE6 100%);
 --skys:linear-gradient(180deg,#052E2A 0,#1D4A40 160px,#919179 260px,#D4C9B5 340px,#EDE6D8 440px,#F1ECE2 700px,#F3EFE6 100%);
 --deep:linear-gradient(135deg,#052E2A,#293855 50%,#7D4822 80%,#B68B58);
 --m1a:#5D7E76;--m1b:#A3A592;--m2a:#40665E;--m2b:#8C9480;--m3a:#2A5048;--m3b:#77846F}
.s6{--f:"Geologica",system-ui,sans-serif;--fd:"Geologica",system-ui,sans-serif;--hw:700;--r:30px;--rb:999px;
 --ink:#1C1C1E;--mute:#636368;--off:#A9A9AE;--line:rgba(60,60,67,.14);--acc:#1C1C1E;--lk:#3A3A3C;
 --g1:#A7AAB2;--g2:#4F5259;--tint:#F0F0F2;--track:rgba(60,60,67,.12);--gold:#C9A04A;--goldt:#86651A;--shc:rgba(0,0,0,.35);--top:#2C2C2E;
 --sky:linear-gradient(180deg,#2C2C2E 0,#55575C 210px,#9A9CA2 360px,#D3D4D8 480px,#ECECEE 640px,#F2F2F4 100%);
 --skys:linear-gradient(180deg,#2C2C2E 0,#55575C 160px,#9A9CA2 260px,#D3D4D8 340px,#ECECEE 440px,#F2F2F4 100%);
 --deep:linear-gradient(135deg,#1C1C1E,#3A3A3C 50%,#6E6E73);
 --m1a:#8E9096;--m1b:#C2C3C8;--m2a:#6E7076;--m2b:#A9AAB0;--m3a:#55575D;--m3b:#93949A}
.s7{--f:"Geologica",system-ui,sans-serif;--fd:"Geologica",system-ui,sans-serif;--hw:700;--r:30px;--rb:999px;color-scheme:dark;
 --ink:#F2F2F5;--mute:#A1A1A8;--off:#6C6C74;--line:rgba(255,255,255,.1);--acc:#F2F2F5;--lk:#D1D1D8;
 --g1:#9A9AA2;--g2:#D1D1D8;--tint:#2A2A30;--track:rgba(255,255,255,.1);--gold:#E0B55A;--goldt:#E0B55A;--shc:rgba(0,0,0,.7);--top:#0E0E10;
 --card:#1C1C21;
 --sky:linear-gradient(180deg,#0E0E10 0,#202024 210px,#2A2A2F 360px,#1E1E22 480px,#161619 640px,#121214 100%);
 --skys:linear-gradient(180deg,#0E0E10 0,#202024 160px,#2A2A2F 260px,#1E1E22 340px,#161619 440px,#121214 100%);
 --deep:linear-gradient(135deg,#0E0E10,#2A2A30 55%,#4A4A52);
 --m1a:#4A4A52;--m1b:#34343A;--m2a:#3A3A41;--m2b:#28282D;--m3a:#2C2C32;--m3b:#1C1C20}
.swatch{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.swatch button{border-radius:calc(var(--r) - 10px);overflow:hidden;border:2px solid transparent;text-align:left;background:#fff}
.swatch button.on{border-color:var(--g2)}
.swatch span{display:block;height:58px}
.swatch b{display:block;font-size:13px;font-weight:600;padding:8px 10px}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--top);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;transition:background-color .3s}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:440px;margin:0 auto;min-height:100dvh;position:relative;background:var(--sky);overflow:clip}
.app.subp{background:var(--skys)}
@media (min-width:600px){.app{box-shadow:0 0 0 1px rgba(0,0,0,.05),0 40px 120px -40px rgba(0,0,0,.5)}}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ph{background:center/cover no-repeat;background-color:var(--tint)}
.grow{flex:1;min-width:0}.grow>small{display:block}
.row{display:flex;align-items:center;gap:12px}
.hscroll{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x pan-y;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.press{transition:transform .15s ease}

.arc{animation:draw 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--d)}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
html.rm .arc,html.rm .fade{animation:none}
.top-gap{height:calc(env(safe-area-inset-top,0px) + 62px)}

/* верх: небо */
.sky{position:relative;padding:0 22px 118px;color:#fff}
.sky .tp{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;min-height:44px}
.chipg{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 5px;border-radius:999px;--gbg:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);font-weight:600;font-size:14px}
.chipg .a{width:30px;height:30px;border-radius:50%}
.rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;--gbg:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);position:relative;flex:none}
.rb .n{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#E5533D;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.sky h1{font-family:var(--fd);font-size:76px;font-weight:var(--hw);letter-spacing:-.05em;line-height:.92;margin:24px 0 10px;position:relative;z-index:1}
.sky.t h1{font-size:54px;margin-top:20px}
.sky.s{padding-bottom:104px}
.sky.s h1{font-size:40px;letter-spacing:-.035em;margin:18px 0 6px}
.sky p{font-size:15px;font-weight:500;opacity:.88;position:relative;z-index:1}
.sky{z-index:0}:where(.sky ~ *){position:relative}.sky ~ *{z-index:1}
.ridge{position:absolute;left:0;right:0;bottom:-110px;height:340px;pointer-events:none;z-index:0}
.ridge svg{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 94%);mask-image:linear-gradient(180deg,#000 62%,transparent 94%)}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:0 14px 120px;margin-top:-94px;position:relative;z-index:2}
.stack>*{min-width:0}
.nobar .stack{padding-bottom:40px}

/* поверхности */
.glass{--gbg:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.55);border-radius:var(--r);box-shadow:0 22px 40px -26px var(--shc)}
.sec{padding:20px}
h2{font-family:var(--fd);font-size:22px;font-weight:var(--hw);letter-spacing:-.025em}
h3{font-size:16px;font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.hd+p{margin-top:-5px}
.lk{font-size:14px;font-weight:600;color:var(--lk)}
.txt{font-size:15px;color:var(--ink);line-height:1.55}
.small{font-size:13px;color:var(--mute);line-height:1.3}
small{line-height:1.25}
:where(small,span.small){display:inline-block}
.price+small,.big+small,.big+.small{display:block;margin-top:4px}

.btn{height:48px;padding:0 20px;border-radius:var(--rb);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.w{background:#fff;color:var(--ink)}
.btn.v{background:var(--acc);color:#fff;box-shadow:0 12px 22px -12px var(--shc)}
.btn.o{--gbg:rgba(255,255,255,.6);border:1px solid var(--line);color:var(--ink)}
.btn.full{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--tint);color:var(--g2)}
.pill.dark{background:var(--acc);color:#fff}
.gp{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;--gbg:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);color:#fff;font-size:12.5px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#E5533D;box-shadow:0 0 0 3px rgba(229,83,61,.3)}
.ic{width:44px;height:44px;border-radius:calc(var(--r) - 12px);display:grid;place-items:center;background:var(--tint);color:var(--g2);flex:none}
.ic.lg{width:54px;height:54px}
.ic.grad{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{height:44px;padding:0 15px;border-radius:var(--rb);font-size:14px;font-weight:600;white-space:nowrap;--gbg:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:0 6px 14px -8px rgba(0,0,0,.25);flex:none}
.chip.on{--gbg:var(--acc);color:#fff;border-color:var(--acc);text-shadow:none}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;--gbg:rgba(255,255,255,.5);border-radius:var(--rb);padding:4px;border:1px solid rgba(255,255,255,.75)}
.seg button{font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:var(--rb);color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li b{display:block;font-size:15px;font-weight:600}
.li small{display:block;font-size:13px;color:var(--mute)}
.tr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:calc(var(--r) - 8px);--gbg:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.8);text-align:left;width:100%}
.tr+.tr{margin-top:8px}
.tr .th img{width:46px;height:46px;object-fit:contain}.tr .th.lk{position:relative}.tr .th.lk img{filter:grayscale(1);opacity:.45}.tr .th.lk svg{position:absolute;right:3px;bottom:3px;width:16px;height:16px;color:var(--mute)}
.tr .th{width:52px;height:52px;border-radius:calc(var(--r) - 14px);flex:none;display:grid;place-items:center;color:var(--g2);background-color:var(--tint);overflow:hidden}
.tr b{display:block;font-size:15px;font-weight:600}
.tr small{display:block;font-size:12.5px;color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.kv small{display:block;font-size:12px;color:var(--mute)}
.kv b{font-size:15.5px;font-weight:600}
.field{display:block;width:100%;height:56px;border-radius:calc(var(--r) - 8px);border:1px solid var(--line);background:rgba(255,255,255,.85);padding:0 18px;font-size:18px;outline:none}
.field:focus{border-color:var(--g2)}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:8}

/* камера */
.cam{position:relative;height:280px;border-radius:calc(var(--r) + 2px);overflow:hidden;border:5px solid rgba(255,255,255,.5);box-shadow:0 34px 50px -26px var(--shc);background:#222 padding-box}
.cam video,.cam .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(20,14,12,.7));pointer-events:none}
.cam .ov{position:absolute;z-index:2}
.cam .t{top:14px;left:14px;right:14px;display:flex;justify-content:space-between}
.cam .b{left:16px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:10px}
.cam .b small{font-size:13px;font-weight:500;opacity:.92;line-height:1.3}

/* главная */
.stat{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 6px}
.stat>button{padding:0 12px;border-left:1px solid var(--line);text-align:left}
.stat>button:first-child{border-left:0}
.stat svg{color:var(--g2);margin-bottom:10px}
.stat small{display:block;font-size:12px;font-weight:500;color:var(--mute)}
.stat b{font-size:17px;font-weight:600}
.treat{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px}

.im.has3 .g3.sm{inset:0;margin:auto;width:150px;height:150px}

.g3{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(60,35,20,.18));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.im.has3{display:block;position:relative;background:radial-gradient(120% 90% at 50% 35%,#fff 0%,var(--tint) 70%);overflow:hidden}.im.has3 .g3{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.ic.g3w{width:56px;height:56px;background:radial-gradient(#fff,var(--tint));padding:4px;overflow:hidden}
.gear{width:150px;flex:none;display:flex;flex-direction:column;justify-content:flex-start;--gbg:rgba(255,255,255,.7);border-radius:calc(var(--r) - 8px);padding:8px 8px 12px;border:1px solid rgba(255,255,255,.8);text-align:left}
.gear .im{height:124px;border-radius:calc(var(--r) - 14px);display:grid;place-items:center;color:var(--g2);margin-bottom:10px;background:var(--tint)}
.gear b{display:block;font-size:13px;font-weight:600;line-height:1.25;padding:0 4px}
.gear small{display:block;font-size:12px;color:var(--mute);padding:2px 4px 0}
.lvl{display:flex;align-items:center;gap:14px;padding:12px;border-radius:calc(var(--r) - 8px);--gbg:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.8)}
.lvl .lv{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--g1),var(--g2) 75%,var(--track) 0);display:grid;place-items:center;flex:none}
.lvl .lv b{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 6px;margin-top:20px}

.ring svg{width:86px;height:86px;display:block;margin:0 auto}
.ring .v{font:700 20px var(--fd);fill:var(--ink);letter-spacing:-.02em}
.ring .u{font:500 10px var(--f);fill:var(--mute)}
.ring b{display:block;font-size:12.5px;font-weight:600;margin-top:4px}
.ring small{display:block;font-size:11px;line-height:1.25;color:var(--mute);margin-top:1px}
.ring.gold small,.ring.max small{color:var(--goldt);font-weight:600}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}

.medal.on{color:var(--ink)}
.m3{display:block;width:62px;height:66px;object-fit:contain;margin:0 auto 6px;filter:drop-shadow(0 8px 10px rgba(40,30,110,.28))}
.medal:not(.on) .m3,.m3.off{filter:grayscale(1) brightness(1.15) contrast(.8);opacity:.5}
.m3.big{width:120px;height:128px;margin:0 auto 10px}

.ev .d{width:52px;height:52px;border-radius:calc(var(--r) - 14px);display:grid;place-items:center;align-content:center;line-height:1;background-color:var(--tint);color:var(--g2);flex:none}
.ev .d b{font-size:19px;font-weight:700;font-family:var(--fd)}
.ev .d small{font-size:11px;font-weight:600;margin-top:3px;color:inherit}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q{padding:16px;display:flex;flex-direction:column;gap:24px;text-align:left}
.q svg{color:var(--g2)}
.q b{font-size:16px;font-weight:600;display:block}
.q small{font-size:12.5px;color:var(--mute)}
.deep{border-radius:calc(var(--r) + 2px);padding:22px;color:#fff;background:var(--deep);box-shadow:0 26px 40px -22px var(--shc);position:relative;overflow:hidden;text-align:left}
.deep svg.m{position:absolute;right:-10px;bottom:-6px;width:240px;height:90px;opacity:.2}
.deep>*:not(svg){position:relative}
.deep b.t{font-family:var(--fd);font-size:24px;font-weight:var(--hw);display:block;letter-spacing:-.02em}
.deep p{line-height:1.35;margin:6px 0 16px;font-size:14px;opacity:.88;max-width:30ch}

/* каталог и карточки */
.hcard{position:relative;display:block;width:100%;height:300px;border-radius:calc(var(--r) + 2px);overflow:hidden;text-align:left;box-shadow:0 26px 40px -24px var(--shc);color:#fff}
.hcard .ph{position:absolute;inset:0}
.hcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(20,14,12,.78))}
.hcard .in{position:absolute;z-index:2;left:18px;right:18px;bottom:16px}
.hcard .in h3{font-family:var(--fd);font-size:34px;font-weight:var(--hw);letter-spacing:-.03em;line-height:1}
.hcard .in p{font-size:13.5px;opacity:.9;margin-top:4px}
.hcard .in .row{margin-top:12px;justify-content:space-between}
.hcard .tag{position:absolute;z-index:2;top:14px;left:14px}
.hero{position:relative;height:400px;color:#fff;margin-bottom:16px}
.hero .ph,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 45%,var(--top) 100%)}
.hero .tp{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 62px);left:22px;right:22px;display:flex;justify-content:space-between}
.hero .nm{position:absolute;z-index:2;left:22px;right:22px;bottom:26px}
.hero .nm h1{font-family:var(--fd);font-size:68px;font-weight:var(--hw);letter-spacing:-.05em;line-height:.92}
.hero .nm p{font-size:15px;opacity:.9;margin-top:8px}
.hero+.stack{margin-top:0}
b:has(+br+:is(small,.small)){display:block;line-height:1.3}b+br:has(+:is(small,.small)){display:none}b+br+:is(small,.small){display:block;margin-top:2px}
.staff{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.ava{width:52px;height:52px;border-radius:50%;flex:none}
.plan{display:block;width:100%;text-align:left;padding:18px;border:2px solid transparent}
.plan.on{border-color:var(--g2)}
.plan ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.plan li{display:flex;gap:8px;font-size:14px}
.plan li svg{color:var(--g2);width:18px;height:18px;margin-top:2px}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.plan.on .radio{border-color:var(--g2)}
.plan.on .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--g2)}
.price{font-family:var(--fd);font-size:26px;font-weight:var(--hw);letter-spacing:-.02em}
.price small{font-family:var(--f);font-size:13px;color:var(--mute);font-weight:500;letter-spacing:0}

/* магазин */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{padding:10px 10px 14px;text-align:left;display:flex;flex-direction:column;gap:10px}
.prod .im{height:118px;border-radius:calc(var(--r) - 12px);display:grid;place-items:center;color:var(--g2);background:var(--tint)}
.prod b{font-size:14px;font-weight:600;line-height:1.3;display:block}
.prod .p{font-family:var(--fd);font-weight:var(--hw);font-size:17px}

/* карта, графики */
.map{display:block;width:100%;height:auto;border-radius:calc(var(--r) - 8px)}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}

.bars i.on{background:linear-gradient(180deg,var(--g1),var(--g2))}
.bars small{font-size:11.5px;color:var(--mute)}
.big{font-family:var(--fd);font-size:40px;font-weight:var(--hw);letter-spacing:-.04em;line-height:1}
/* линия и кружки привязаны к одному пункту, поэтому всегда на одной оси */
.tl{padding-left:30px}
.tl>div{position:relative;padding:0 0 18px}
.tl>div:last-child{padding-bottom:0}
.tl>div::before{content:"";position:absolute;z-index:1;left:-28px;top:4px;width:14px;height:14px;box-sizing:border-box;border-radius:50%;background:#fff;border:3px solid var(--g2);box-shadow:0 0 0 3px #fff}
.tl>div::after{content:"";position:absolute;left:-22px;top:11px;bottom:-11px;width:2px;background:color-mix(in srgb,var(--g2) 28%,transparent)}
.tl>div:last-child::after{content:none}
.tl b{font-size:14.5px;font-weight:600;line-height:22px;display:block}
.tl small{display:block;margin-top:1px;font-size:13px;line-height:1.35;color:var(--mute)}

/* чат */
.msgs{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-height:calc(100dvh - env(safe-area-inset-top,0px) - 334px)}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4}

.msg.out{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg small{display:block;font-size:11px;opacity:.6;margin-top:3px}
.composer{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;padding:8px;z-index:8}
.composer input{flex:1;height:46px;border:0;background:transparent;padding:0 10px;outline:none;font-size:15px}

/* таббар */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(min(100vw,440px) - 28px);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 4px 9px;--gbg:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.6);border-radius:var(--r);box-shadow:0 14px 30px -12px var(--shc);color:var(--mute)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:12px;font-weight:600;line-height:1.25}
.tabbar svg.i{width:22px;height:22px}
.tabbar .on{color:var(--acc)}
.tabbar .t3{width:32px;height:32px;object-fit:contain;margin-top:-3px;filter:saturate(.8);opacity:.8;transition:filter .2s,opacity .2s,transform .25s}
.tabbar .on .t3{filter:drop-shadow(0 3px 4px rgba(60,40,160,.35));opacity:1;transform:translateY(-1px)}
.tabbar .t3h{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(20,10,60,.35))}
.tabbar .main{position:relative;margin-top:-39px;color:var(--mute)}
.tabbar .main.on{color:var(--acc)}
.tabbar .orb{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--deep);color:#fff;border:4px solid rgba(255,255,255,.95);box-shadow:0 12px 24px -8px var(--shc),0 0 0 1px rgba(0,0,0,.04);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.tabbar .orb svg.i{width:38px;height:38px;margin:-2px 0 0 -2px}
.tabbar .main.on .orb{box-shadow:0 14px 28px -8px var(--shc),0 0 0 5px color-mix(in srgb,var(--g1) 35%,transparent)}

/* шторка, тост */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,14,12,.45);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.confetti{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
.pop-bg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(20,12,40,.45);opacity:0;transition:opacity .25s}.pop-bg.on{opacity:1}
.pop{width:min(100%,340px);background:#FBF8F4;border-radius:28px;padding:22px 22px 18px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);transform:translateY(24px) scale(.82);opacity:0;transition:transform .5s cubic-bezier(.2,1.35,.4,1),opacity .25s}.pop-bg.on .pop{transform:none;opacity:1}
.pop-bg.on .pop>*{animation:rise .5s .12s cubic-bezier(.2,.8,.2,1) both}.pop-bg.on .pop>*:nth-child(2){animation-delay:.17s}.pop-bg.on .pop>*:nth-child(3){animation-delay:.21s}.pop-bg.on .pop>*:nth-child(4){animation-delay:.25s}.pop-bg.on .pop>*:nth-child(n+5){animation-delay:.29s}
.pop-bg.on .pop img{animation:popImg .7s .1s cubic-bezier(.2,1.5,.4,1) both}@keyframes popImg{from{transform:scale(.4) rotate(-12deg);opacity:0}}
html.rm .pop{transform:none;transition:opacity .25s}html.rm .pop-bg.on .pop *{animation:fo .3s ease both}
.pop img{height:150px;display:block;margin:-60px auto 6px;filter:drop-shadow(0 12px 18px rgba(60,40,120,.3))}.pop small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}.pop h2{margin:4px 0 8px}.pop p{margin-bottom:16px}
.sheet{position:fixed;z-index:61;left:50%;bottom:0;width:min(100vw,440px);transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.32,.72,0,1);background:#FBF8F4;border-radius:calc(var(--r) + 4px) calc(var(--r) + 4px) 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:88dvh;overflow:auto;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4)}
.sheet.on{transform:translate(-50%,0)}
.sheet.on>*:not(.grab){animation:rise .5s .08s cubic-bezier(.2,.8,.2,1) both}
.sheet.on>*:nth-child(3){animation-delay:.13s}.sheet.on>*:nth-child(4){animation-delay:.18s}.sheet.on>*:nth-child(5){animation-delay:.23s}.sheet.on>*:nth-child(n+6){animation-delay:.28s}
html.rm .sheet{transition-duration:.25s}html.rm .sheet.on>*{animation:fo .3s ease both}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-size:24px;margin-bottom:6px}

.video{width:100%;border-radius:calc(var(--r) - 6px);display:block;background:#000;aspect-ratio:4/5;object-fit:cover}
.code{display:flex;gap:10px;justify-content:center}
.code input{width:58px;height:66px;text-align:center;font-size:26px;font-weight:600;border-radius:calc(var(--r) - 8px);border:1px solid var(--line);background:rgba(255,255,255,.85);outline:none}
.welcome{position:relative;min-height:100dvh;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 28px)}
.welcome video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.welcome::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 30%,var(--top) 78%);z-index:1}
.welcome>*:not(video){position:relative;z-index:2}
.welcome h1{font-family:var(--fd);font-size:48px;font-weight:var(--hw);letter-spacing:-.045em;line-height:.98;margin:10px 0 14px}
.welcome ul{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:10px;font-size:15px;opacity:.92}
.welcome li{display:flex;gap:10px;align-items:flex-start}
.welcome li svg{margin-top:2px}
.counter{display:flex;align-items:center;gap:14px}
.counter button{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.counter b{font-size:20px;min-width:24px;text-align:center}

/* Стекло: обычное размытие фона прямо на плашке, без преломления. Браузер сам скругляет размытие по border-radius плашки,
   поэтому отдельные слои ::before/::after и обрезка не нужны. Заливка плашки задаётся переменной --gbg */
.glass,.btn.o,.chip,.chipg,.rb,.gp,.seg,.tr,.gear,.lvl,.msg.in,.tabbar{background:var(--gbg,transparent);backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.glass,.btn.o,.tr,.gear,.lvl,.msg.in,.tabbar{--bf:blur(18px) saturate(1.6)}
.chip,.chipg,.rb,.gp,.seg{--bf:blur(12px) saturate(1.4)}
.tabbar{--bf:blur(24px) saturate(1.8)}
.tr,.gear,.lvl{border-radius:calc(var(--r) - 8px)}
.chip,.chipg,.rb,.gp,.seg,.btn.o{border-radius:999px}
.msg.in{--gbg:rgba(255,255,255,.85);align-self:flex-start;border-radius:18px 18px 18px 6px}
.glass,.tr,.gear,.lvl{overflow:hidden}
.camgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.empty{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--tint);border-radius:calc(var(--r) - 8px);padding:12px;border:0;color:inherit;font:inherit}
.empty .g3w{width:64px;height:64px;flex:none;border-radius:16px;display:grid;place-items:center;background:radial-gradient(#fff,var(--tint))}.empty .g3w img{width:56px;height:56px;object-fit:contain}
.empty b{display:block;font-size:15px;font-weight:600}.empty small{display:block;font-size:13px;color:var(--mute);line-height:1.3;margin-top:2px}
.glass.empty{border-radius:var(--r);padding:16px}
.g3gift{width:58px;height:58px;flex:none;display:grid;place-items:center}.g3gift img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(60,35,20,.2))}
.deep.gift .gbox{position:absolute;right:14px;top:50%;width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(0,0,0,.3));transform:translateY(-50%) rotate(-6deg)}.deep.gift b.t,.deep.gift p{max-width:60%}
.cbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:8;display:flex;flex-direction:column;gap:8px}.cbar .composer{position:relative;bottom:auto}
.qr{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 4px}.qr::-webkit-scrollbar{display:none}
.qr .chip{color:var(--ink);--gbg:rgba(255,255,255,.75);border-color:rgba(255,255,255,.9);text-shadow:none}
.cam .ov .gp,.hero .gp{--gbg:rgba(20,14,40,.32);border-color:rgba(255,255,255,.35)}
.evhd{display:flex;align-items:center;gap:14px;margin-bottom:14px}.evhd .d{width:64px;height:64px;border-radius:18px;background:var(--tint);display:grid;place-items:center;text-align:center;flex:none;color:var(--g2)}.evhd .d b{font-size:24px;line-height:1;display:block}.evhd .d small{font-size:12px;font-weight:600}
.rinfo{display:flex;justify-content:center;margin:4px 0 10px}.rinfo .ring{pointer-events:none;width:130px}

/* ---------- переходы между экранами (View Transitions), появление карточек ---------- */
/* push/pop как в нативных приложениях: новый экран заезжает справа поверх старого, старый уходит влево и темнеет; назад наоборот.
   Вкладки: сдвиг на 48px с затуханием в сторону выбранной вкладки. В режиме «меньше движения» только затухание */
::view-transition-old(root),::view-transition-new(root){mix-blend-mode:normal;animation-duration:.46s;animation-timing-function:cubic-bezier(.32,.72,0,1);animation-fill-mode:both}
html[data-dir=fwd]::view-transition-old(root){animation-name:vtPushOut}
html[data-dir=fwd]::view-transition-new(root){animation-name:vtPushIn;box-shadow:-24px 0 48px rgba(20,12,50,.3)}
html[data-dir=back]::view-transition-old(root){animation-name:vtPopOut;z-index:2;box-shadow:-24px 0 48px rgba(20,12,50,.3)}
html[data-dir=back]::view-transition-new(root){animation-name:vtPopIn}
html[data-dir=tabR]::view-transition-old(root){animation:vtAxOutL .42s cubic-bezier(.4,0,.2,1) both}
html[data-dir=tabR]::view-transition-new(root){animation:vtAxInR .42s cubic-bezier(.2,.8,.2,1) both}
html[data-dir=tabL]::view-transition-old(root){animation:vtAxOutR .42s cubic-bezier(.4,0,.2,1) both}
html[data-dir=tabL]::view-transition-new(root){animation:vtAxInL .42s cubic-bezier(.2,.8,.2,1) both}
html[data-dir=tab]::view-transition-old(root){animation:vtHold .4s both}
html[data-dir=tab]::view-transition-new(root){animation:vtZoomIn .4s cubic-bezier(.2,.8,.2,1) both}
html.rm[data-dir]::view-transition-old(root){animation:vtHold .3s both;box-shadow:none;z-index:auto}
html.rm[data-dir]::view-transition-new(root){animation:vtFadeIn .3s ease both;box-shadow:none}
@keyframes vtPushOut{to{transform:translateX(-30%);filter:brightness(.82)}}
@keyframes vtPushIn{from{transform:translateX(100%)}}
@keyframes vtPopOut{to{transform:translateX(100%)}}
@keyframes vtPopIn{from{transform:translateX(-30%);filter:brightness(.82)}}
@keyframes vtAxOutL{to{transform:translateX(-24px)}}
@keyframes vtAxOutR{to{transform:translateX(24px)}}
@keyframes vtAxInR{from{transform:translateX(48px);opacity:0}}
@keyframes vtAxInL{from{transform:translateX(-48px);opacity:0}}
@keyframes vtHold{to{opacity:1}}
@keyframes vtFadeIn{from{opacity:0}}
@keyframes vtZoomIn{from{transform:scale(.96);opacity:0}}
/* браузер без View Transitions: анимируем только входящий экран */
.app.pg-fwd{animation:pgInR .42s cubic-bezier(.32,.72,0,1) both}.app.pg-back{animation:pgInL .42s cubic-bezier(.32,.72,0,1) both}
.app.pg-tabR{animation:pgAxR .4s cubic-bezier(.2,.8,.2,1) both}.app.pg-tabL{animation:pgAxL .4s cubic-bezier(.2,.8,.2,1) both}.app.pg-tab{animation:vtZoomIn .4s cubic-bezier(.2,.8,.2,1) both}
html.rm .app[class*=pg-]{animation:vtFadeIn .3s ease both}
@keyframes pgInR{from{transform:translateX(60%);opacity:0}}@keyframes pgInL{from{transform:translateX(-40%);opacity:0}}
@keyframes pgAxR{from{transform:translateX(48px);opacity:0}}@keyframes pgAxL{from{transform:translateX(-48px);opacity:0}}
/* имя перехода только на время анимации: постоянный view-transition-name делает таббар backdrop root и гасит преломление */
html.vt .tabbar{view-transition-name:tabbar}
.enter .stack>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter .stack>*:nth-child(2){animation-delay:.05s}.enter .stack>*:nth-child(3){animation-delay:.1s}.enter .stack>*:nth-child(4){animation-delay:.15s}.enter .stack>*:nth-child(5){animation-delay:.2s}.enter .stack>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.rings:not(.in) .arc{animation-play-state:paused}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--track);animation:barup .8s cubic-bezier(.2,.8,.2,1) both}.bars div:nth-child(2) i{animation-delay:.04s}.bars div:nth-child(3) i{animation-delay:.08s}.bars div:nth-child(4) i{animation-delay:.12s}.bars div:nth-child(5) i{animation-delay:.16s}.bars div:nth-child(6) i{animation-delay:.2s}.bars div:nth-child(7) i{animation-delay:.24s}
@keyframes barup{from{height:0}}
/* карточки ниже первого экрана выезжают, когда до них докрутили */
.rv:not(.in){opacity:0}

@keyframes rvIn{from{opacity:0;transform:translateY(28px) scale(.98)}}

@keyframes fo{from{opacity:0}}
html.rm .enter .stack>*,html.rm .rv.in{animation:fo .35s ease both}html.rm .bars i{animation:none}html.rm .rings:not(.in) .arc{animation-play-state:running}

/* ---------- пуш-баннер, заставка ---------- */
.push{position:fixed;z-index:95;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);width:min(calc(100vw - 20px),420px);transform:translate(-50%,-150%);transition:transform .5s cubic-bezier(.2,1.2,.3,1);display:flex;gap:12px;align-items:center;padding:12px 16px 12px 12px;border-radius:22px;background:rgba(28,22,52,.9);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);color:#fff;box-shadow:0 18px 40px -14px rgba(0,0,0,.55);text-align:left}
.push.on{transform:translate(-50%,0)}
.push img{width:42px;height:42px;border-radius:12px;flex:none}
.push small{display:block;font-size:11.5px;opacity:.7}
.push b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.push span{display:block;font-size:13px;opacity:.88;line-height:1.3}
.splash{position:fixed;inset:0;z-index:100;background:var(--deep);display:grid;place-content:center;justify-items:center;gap:6px;color:#fff;transition:opacity .45s}
.splash img{width:124px;height:124px;border-radius:32px;box-shadow:0 24px 50px -16px rgba(0,0,0,.5);margin-bottom:14px;animation:spl .7s cubic-bezier(.2,1.4,.4,1) both}
.splash b{font:700 30px var(--fd);letter-spacing:-.03em}.splash small{font-size:14px;opacity:.75}
.splash.out{opacity:0;pointer-events:none}
@keyframes spl{from{transform:scale(.6);opacity:0}}

/* ---------- установка ---------- */
.inst{display:flex;align-items:center;gap:14px}
.inst img{width:56px;height:56px;border-radius:15px;flex:none;box-shadow:0 8px 16px -8px var(--shc)}
.inst b{display:block;font-size:15.5px;font-weight:600}
.ib{padding:10px 8px 10px 12px;gap:12px}.ib img{width:44px;height:44px;border-radius:12px}
.ib .x{width:34px;height:34px;display:grid;place-items:center;color:var(--mute);flex:none}

/* ---------- истории ---------- */
.stories{margin:0 -14px;padding:2px 14px 2px;gap:12px}
.story{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:12px;font-weight:600;line-height:1.15;text-shadow:0 1px 3px rgba(20,10,50,.55)}
.story .sr{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,var(--g1),var(--gold),var(--g2),var(--g1));display:grid}
.story.seen .sr{background:rgba(255,255,255,.6)}
.story .sr i{display:block;border-radius:50%;border:3px solid #fff;background:center/cover no-repeat var(--deep);position:relative}
.story .sr i em{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.story .nw{position:relative;margin-top:-17px;margin-bottom:-2px;z-index:1;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--g2);color:#fff;text-shadow:none;box-shadow:0 0 0 2px #fff}
.sv{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:440px;z-index:88;background:#000;opacity:0;transform:scale(.2);transform-origin:var(--ox,50%) var(--oy,30%);border-radius:40px;transition:opacity .25s,transform .45s cubic-bezier(.32,.72,0,1),border-radius .45s;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.sv.on{opacity:1;transform:none;border-radius:0}
html.rm .sv{transform:none}
.sv .md{position:absolute;inset:0}
.sv .md img,.sv .md video{width:100%;height:100%;object-fit:cover;display:block}
.sv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 20%,transparent 58%,rgba(0,0,0,.7));pointer-events:none;z-index:1}
.sv .pb{position:absolute;z-index:3;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:4px}
.sv .pb i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.sv .pb i b{display:block;height:100%;width:0;background:#fff}
.sv .who{position:absolute;z-index:3;left:14px;right:6px;top:calc(env(safe-area-inset-top,0px) + 22px);display:flex;align-items:center;gap:10px;color:#fff}
.sv .who .ava{width:40px;height:40px;box-shadow:0 0 0 2px rgba(255,255,255,.8)}

 return `<button class="ring press ${s.max?'max':''} ${s.gold?'gold':''}" ${tap==='info'?`data-ring="${id}|${s.k}"`:tap?`data-train="${s.k}"`:''} aria-label="${s.name}: ${s.v} ${s.u}, ${sub}"><svg viewBox="0 0 80 80">${k?'':`<defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${getVar('--g1')}"/><stop offset="1" stop-color="${getVar('--g2')}"/></linearGradient></defs>`}<circle cx="40" cy="40" r="34" fill="none" stroke="var(--track)" stroke-width="8"/>${arc(40,34,8,col,s.max?1:Math.min(1,s.p/100))}<text x="40" y="43" text-anchor="middle" class="v">${s.v}</text><text x="40" y="57" text-anchor="middle" class="u">${s.u}</text></svg>${tap===true&&s.max?`<span class="rp ok" aria-hidden="true">${ic('check')}</span>`:tap===true&&!(S.training===s.k&&id===S.horse)?`<span class="rp" aria-hidden="true">${ic('plus')}</span>`:''}<b>${s.short}</b><small>${sub}</small></button>`}).join('')}</div>`}
function getVar(n){return getComputedStyle(document.body).getPropertyValue(n).trim()}
function evRow([d,m,t,s,p],past,k){return `<button class="tr ev" ${past?`data-go="report"`:`data-evd="${k}"`}><div class="d ${past?'ph':''}" ${past?`style="background-image:url(${M}${p}.jpg);color:#fff"`:''}>${past?ic('photo','width:22px;height:22px'):`<b>${d}</b><small>${m}</small>`}</div><div class="grow"><b>${t}</b><small>${past?d+' '+m+'. ':''}${s}</small></div>${ic('arrow','color:var(--off)')}</button>`}
function events(){return `<div class="seg" style="margin-bottom:12px" data-segev>${['Ближайшие','Прошедшие'].map((t,k)=>`<button class="${S.ev===k?'on':''}" data-ev="${k}">${t}</button>`).join('')}</div>${(S.ev?EVP:EVU).map((e,k)=>evRow(e,S.ev,k)).join('')}`}
function tState(t,id){const o=S.tst[id+':'+t.id];if(o)return o;if(t.state!=='lock')return id==='grom'?t.state:'avail';const v=stats(id).find(x=>x.k===t.need[0]).v;return v>=t.need[1]?'avail':'lock'}
function tDone(t,id){const k=id+':'+t.id;return k in S.lessons?S.lessons[k]:0}
function unlocked(id){return TRICKS.filter(t=>tState(t,id)==='avail').map(t=>t.id)}
/* трюк карточкой в горизонтальной ленте, как снаряжение (прежний вид строкой: trickRow) */
function trickCard(t,id){const ts=tState(t,id),img=`<img src="${R3['tr_'+t.id]}" alt="">`;let sub,act='';
 if(ts==='done'){sub=`Освоен ${S.tdate[id+':'+t.id]||t.date||'7 октября'}`;act=`<button class="btn v sm press" data-trick="${t.id}">${ic('play','width:12px;height:12px')}Смотреть</button>`}
 else if(ts==='learn'){const dn=tDone(t,id),pc=Math.round(dn/t.lessons*100);sub=dn?`Занятие ${dn} из ${t.lessons}`:`Первое занятие завтра`;act=`<div class="tkp"><i style="width:${pc}%"></i></div><span class="tkpc">${pc}%</span>`}
 else if(ts==='avail'){sub=`${t.lessons} занятий${t.price?` · ${t.price.toLocaleString('ru')}&nbsp;₽`:''}`;act=`<button class="btn v sm press" data-learn="${t.id}">Изучить</button>`}
 else{const s=stats(id).find(x=>x.k===t.need[0]);sub=`Откроется при ${t.need[2].replace(/ (\S+)$/,'&nbsp;$1')}, сейчас ${s.v}&nbsp;${s.u}`}
 return `<div class="gear tk${ts==='lock'?' tlk':''}"><div class="im">${img}${ts==='lock'?ic('lock'):''}</div><b>${t.name}</b><small>${sub}</small>${act?`<div class="tka">${act}</div>`:''}</div>`}
function trickRow(t,id){const st=stats(id),ts=tState(t,id);if(ts==='done')return `<div class="tr"><div class="th"><img src="${R3['tr_'+t.id]}" alt=""></div><div class="grow"><b>${t.name}</b><small>Освоен ${S.tdate[id+':'+t.id]||t.date||'7 октября'}</small></div><button class="btn v sm press" data-trick="${t.id}">${ic('play','width:12px;height:12px')}Смотреть</button></div>`;
 if(ts==='learn'){const dn=tDone(t,id);return `<div class="tr"><div class="th"><img src="${R3['tr_'+t.id]}" alt=""></div><div class="grow"><b>${t.name}</b><small>${dn?`Занятие ${dn} из ${t.lessons}, следующее в четверг`:`Первое занятие завтра, всего ${t.lessons}`}</small></div><span class="pill">${Math.round(dn/t.lessons*100)}%</span></div>`}
 if(ts==='avail')return `<div class="tr"><div class="th"><img src="${R3['tr_'+t.id]}" alt=""></div><div class="grow"><b>${t.name}</b><small>Открыт, ${t.lessons} занятий</small></div><button class="btn v sm press" data-learn="${t.id}">Изучить</button></div>`;
 const s=st.find(x=>x.k===t.need[0]);return `<div class="tr"><div class="th lk"><img src="${R3['tr_'+t.id]}" alt="">${ic('lock')}</div><div class="grow"><b>${t.name}</b><small>Откроется при ${t.need[2]}, сейчас ${s.v}&nbsp;${s.u}</small></div></div>`}


function camMedia(k){if(camOff())return `<div class="ph" style="background-image:url(${M}${k}.jpg);filter:blur(12px) brightness(.55);transform:scale(1.1)"></div><div class="off"><div>${ic('wifioff','width:36px;height:36px;margin:0 auto 10px')}<b>Нет соединения</b><p class="small" style="color:#fff;opacity:.85;margin:6px 0 14px">Эфир продолжится, когда вернётся интернет</p><button class="btn w sm press" data-retry>Повторить</button></div></div>`;
 return `<video src="${M}${k}.mp4" poster="${M}${k}.jpg" autoplay muted loop playsinline></video><div class="ld"><div><div class="spin"></div><small>Подключаемся к камере</small></div></div>`}
function storyList(){const L=[...S.staffStories.filter(s=>!s.h||s.h===S.horse),...STO],seen=s=>S.seen.includes(s.id+':'+S.horse);return [...L.filter(s=>!seen(s)),...L.filter(seen)]}
function storyThumb(s){const m=s.it[0][0];return s.thumb||(/^(blob:|data:)/.test(m)?'':M+m+'.jpg')}
function storiesRow(){return `<div class="stories hscroll" aria-label="Истории дня">${storyList().map((s,k)=>{const seen=S.seen.includes(s.id+':'+S.horse),th=storyThumb(s);return `<button class="story press ${seen?'seen':''}" data-story="${k}"><span class="sr"><i style="${th?`background-image:url(${th})`:''}">${th?'':`<em>${ic('play')}</em>`}</i></span>${s.fresh&&!seen?'<span class="nw">новое</span>':''}${s.title}</button>`}).join('')}</div>`}
function installBanner(){if(!BIP||isStandalone()||LS.get('instx',0))return '';return `<div class="glass inst ib"><img src="icons/icon-192.png" alt=""><div class="grow"><b>Установите приложение</b><small class="small">Иконка на главном экране, без адресной строки</small></div><button class="btn v sm press" data-install>Установить</button><button class="x" data-instx aria-label="Скрыть">${ic('plus','transform:rotate(45deg)')}</button></div>`}
function tqName(o){return {apples:'Яблоки',carrot:'Морковь',treats:'Травяные печенья',hay:'Сено'}[o.p]||SHOP.find(x=>x.id===o.p).name}
function tqStage(o){return o.done?2:Date.now()-o.t>2500?1:0}
function tqStatus(n){const o=S.tq.find(x=>x.n==n);if(!o)return 'оформлен';const st=tqStage(o);return st===2?'вручено, есть видео':st===1?'Алексей угостит '+o.slot:'оплачено'}
function tqGot(o){return `${H(o.h).name} ${fw(o.h,'получил','получила')} ${tqName(o).toLowerCase()}`}
function tqCards(){return S.tq.filter(o=>o.h===S.horse&&!o.seen).slice(0,2).map(o=>{const st=tqStage(o);
 if(st===2)return `<button class="glass tqc press" data-tqv="${o.n}"><span class="vc pulse"><video src="${o.vid||M+'pasture.mp4'}" ${o.vid?'':`poster="${M}pasture.jpg"`} muted autoplay loop playsinline></video><span class="pl">${ic('play','width:18px;height:18px')}</span></span><span class="grow"><b>${tqGot(o)}</b><small>Алексей прислал видео в ${o.doneAt}</small></span><span class="pill">Смотреть</span></button>`;
 return `<div class="glass tqc"><span class="tqi"><img src="${G3D[o.p]}" alt=""></span><span class="grow"><b>${tqName(o)} для ${nm(o.h,0)}</b><small>${st?`Алексей угостит ${o.slot} и снимет видео`:'Оплачено, передаём конюху'}</small><span class="tqs"><i class="on"></i><i class="${st?'on':'run'}"></i><i class="${st?'run':''}"></i></span></span></div>`}).join('')}
function albItems(){return [...S.album.filter(a=>!a.h||a.h===S.horse),...ALB.map(([k,v,c,d])=>({k:v?'vid':'img',src:M+k+(v?'.mp4':'.jpg'),poster:M+k+'.jpg',cap:c,d}))]}
function albCard(){const L=albItems(),th=L.slice(0,3).map(a=>a.k==='img'?a.src:a.poster||'');return `<button class="q glass press albw" data-go="album">${ic('photo','width:26px;height:26px')}<span class="grow"><b>Альбом</b><small>${plural(L.length,'снимок','снимка','снимков')} и видео</small></span><span class="th3">${th.map(u=>`<span style="${u?`background-image:url(${u})`:'background:var(--deep)'}"></span>`).join('')}</span></button>`}
function poll(){const v=S.vote,n=VOTE.n.map((x,k)=>x+(v===k?1:0)),tot=n.reduce((a,b)=>a+b);
 return `<div class="poll">${VOTE.opts.map((o,k)=>v==null?`<button class="press" data-vote="${k}"><span>${o}</span><em>Выбрать</em></button>`:`<button class="${v===k?'me':''}" disabled><i style="width:${Math.round(n[k]/tot*100)}%"></i><span>${o}${v===k?ic('check','width:16px;height:16px'):''}</span><em>${Math.round(n[k]/tot*100)}%</em></button>`).join('')}</div><p class="small" style="margin-top:10px">${v==null?'Голосование до 15 октября, у каждого владельца один голос':`Ваш голос учтён. Проголосовали ${plural(tot,'владелец','владельца','владельцев')}, итоги 15 октября`}</p>`}
function phoneCard(){const inst=!isStandalone(),nt='Notification' in window,ng=nt&&Notification.permission==='granted';if(!inst&&(!nt||ng))return '';
 return `<div class="glass sec"><div class="inst"><img src="icons/icon-192.png" alt=""><div class="grow"><b>${inst?'Приложение на телефоне':'Уведомления'}</b><small class="small">${inst?'Иконка на главном экране, полный экран и работа без интернета':'Видео от конюха и новости клуба сразу на экран телефона'}</small></div></div>
 ${inst?`<button class="btn v full press" style="margin-top:14px" data-install>${ic('phone','width:18px;height:18px')}Установить на главный экран</button>`:''}${nt?(ng?`<p class="small" style="margin-top:12px;text-align:center">${ic('check','width:14px;height:14px;display:inline;vertical-align:-2px')} Уведомления включены</p>`:`<button class="btn o full press" style="margin-top:8px" data-notifon>${ic('bell','width:18px;height:18px')}Включить уведомления</button>`):''}</div>`}

 <div id="tqbox">${tqCards()}</div>
 <section class="glass sec"><div class="hd"><h2>Снаряжение</h2><button class="lk" data-shop="Снаряжение">Добавить</button></div>
  ${gearOf(h.id).length?`<div class="hscroll" style="margin:0 -20px;padding:0 20px">${gearOf(h.id).map(([i,n,s])=>`<button class="gear press" data-go="purchases"><div class="im${G3.includes(i)?' has3':''}">${G3.includes(i)?g3(i):ic(i,'width:42px;height:42px;stroke-width:1.5')}</div><b>${n}</b><small>${s}</small></button>`).join('')}</div>`:`<button class="empty press" data-shop="Снаряжение"><span class="g3w">${g3('halter')}</span><span><b>Пока пусто</b><small>Подберите ${nm(h.id,1)} первое снаряжение: недоуздок, щётки, попону</small></span></button>`}</section>
 <section class="glass sec"><div class="hd"><h2>Развитие</h2></div>
  <div class="lvl"><div class="lv"><b>3</b></div><div class="grow"><b style="font-size:17px;font-weight:600">Уровень «Друг»</b><br><span class="small">${S.xp.toLocaleString('ru')} из 3 500 XP, дальше скидка 15% в магазине</span></div></div>
  ${rings(S.horse,true)}</section>
 <section class="glass sec"><div class="hd"><h2>Трюки</h2><span class="lk">${TRICKS.filter(t=>tState(t,h.id)==='done').length} из ${TRICKS.length}</span></div><div class="hscroll" style="margin:0 -20px;padding:0 20px">${TRICKS.map(t=>trickCard(t,S.horse)).join('')}</div></section>
 <section class="glass sec"><div class="hd"><h2>Награды</h2><span class="lk">${MED.filter(m=>m[2]).length} из ${MED.length}</span></div><div class="medals">${MED.map((m,k)=>`<button class="medal press ${m[2]?'on':''}" data-medal="${k}"><img class="m3" src="${R3[MIMG[k]]}" alt="">${m[0]}</button>`).join('')}</div></section>

 <button class="deep press" data-go="buyout">${mountMark}<b class="t">Выкупить ${nm(h.id,2)}</b><p>Половина уже оплаченной подписки идёт в счёт цены</p><span class="btn w sm">${ic('key')}Узнать условия</span></button>
</div>`};

V.report=()=>{const id=S.horse,h=H(id);return skySub('Отчёт','6 октября, вторник')+`<div class="stack">
 <div class="glass sec"><div class="staff"><span class="ava ph" style="background-image:url(${M}alexey.jpg)"></span><div class="grow"><b>Алексей, конюх</b><small class="small">Отчёт в 19:40</small></div></div><p class="txt" style="margin-top:14px">${h.name} весь день ${fw(id,'был бодрым','была бодрой')}. Утром ходили на пастбище у ручья, после обеда искупались в реке, ${fw(id,'ему','ей')} очень понравилось. ${fw(id,'Съел','Съела')} все яблоки, которые вы прислали. Копыта в порядке.</p></div>
 <div class="grid2">${['pov','pasture','stall','arena'].map(p=>`<button class="ph press" aria-label="Фото" data-toast="Фото откроется на весь экран" style="height:150px;border-radius:calc(var(--r) - 6px);background-image:url(${M}${p}.jpg)"></button>`).join('')}</div>
 <div class="glass sec"><div class="kv">${[['Прошёл','12,4 км'],['Корм','Овёс, сено, яблоки'],['Вес',PASS[id].w+' кг'],['Настроение','Бодрое']].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div></div>
 <div class="glass sec"><h2 style="margin-bottom:16px">День ${nm(id,0)}</h2><div class="tl">${[['06:30','Осмотр и завтрак'],['09:00','Чистка и выгул на пастбище'],['13:00','Купание в реке'],['16:00','Отдых в деннике'],['19:00','Вечерний осмотр']].map(([t,s])=>`<div><b>${t}</b><small>${s}</small></div>`).join('')}</div></div></div>`};

V.stats=()=>{const per=S.stats,km=[[12.4,'км за день'],[71.8,'км за неделю'],[312,'км за месяц']][per],bars=[[6,9,8,12,10,7,12.4],[58,64,71,72],[240,280,312]][per],lab=[['Чт','Пт','Сб','Вс','Пн','Вт','Ср'],['1 нед','2 нед','3 нед','4 нед'],['Авг','Сен','Окт']][per],mx=Math.max(...bars);
 return skySub('Статистика',`Где ${fw(S.horse,'был','была')} и сколько ${fw(S.horse,'прошёл','прошла')} ${H(S.horse).name}`)+`<div class="stack">
 <div class="seg" style="justify-self:start" data-segst>${['День','Неделя','Месяц'].map((t,k)=>`<button class="${per===k?'on':''}" data-st="${k}">${t}</button>`).join('')}</div>
 <div class="glass sec"><div class="row" style="align-items:flex-end;justify-content:space-between"><div><div class="big">${String(km[0]).replace('.',',')}</div><span class="small">${km[1]}</span></div><div style="text-align:right"><b>${[14,82,356][per]} 200</b><br><span class="small">шагов</span></div></div>
 <div class="bars">${bars.map((b,k)=>`<div><i class="${k===bars.length-1?'on':''}" style="height:${Math.round(b/mx*100)}%"></i><small>${lab[k]}</small></div>`).join('')}</div></div>
 <div class="glass sec"><div class="hd"><h2>Маршрут за день</h2><span class="pill">GPS</span></div>
  <svg class="map" viewBox="0 0 340 240" role="img" aria-label="Карта территории Marali с маршрутом"><rect width="340" height="240" fill="var(--tint)"/><path d="M0 170 C60 150 90 200 150 185 S260 140 340 160 V240 H0Z" fill="#fff" opacity=".55"/><path d="M-10 60 C60 90 120 40 190 70 S300 120 350 90" fill="none" stroke="#9FC3D6" stroke-width="9" stroke-linecap="round" opacity=".8"/><g fill="none" stroke="var(--g2)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"><path d="M70 190 C90 140 130 150 150 120 S210 80 250 100 S300 160 270 190"/></g><circle cx="70" cy="190" r="7" fill="var(--acc)"/><circle cx="270" cy="190" r="9" fill="var(--g2)" stroke="#fff" stroke-width="3"/><text x="82" y="210" font-size="12" fill="var(--mute)" font-family="inherit">Денник</text><text x="200" y="218" font-size="12" fill="var(--mute)" font-family="inherit">Пастбище, сейчас</text><text x="200" y="58" font-size="12" fill="var(--mute)" font-family="inherit">река Катунь</text></svg>
  <p class="small" style="margin-top:10px">Карта территории условная, точные зоны согласуем с Marali.</p></div></div>`};

V.health=()=>skySub('Здоровье',`Медкарта ${nm(S.horse,0)}`)+`<div class="stack">
 <div class="deep">${mountMark}<span class="pill" style="background:rgba(255,255,255,.2);color:#fff">${ic('check','width:14px;height:14px')}Здоров</span><b class="t" style="margin-top:12px">Всё в порядке</b><p>Последний осмотр 28 сентября. Ветеринар Игорь Сабашкин.</p></div>
 <div class="glass sec"><div class="kv">${[['temp','Температура','37,6°'],['pulse','Пульс','36 уд/мин'],['weight','Вес',PASS[S.horse].w+' кг'],['cal','Следующий осмотр','10 октября']].map(([i,a,b])=>`<div class="row" style="align-items:flex-start"><span class="ic">${ic(i)}</span><div><small>${a}</small><b>${b}</b></div></div>`).join('')}</div></div>
 <div class="glass sec"><h2 style="margin-bottom:14px">История</h2>${[['tooth','Осмотр зубов','28 сентября, без замечаний'],['shoe','Расчистка и ковка','1 октября, кузнец Иван'],['cross','Прививка от гриппа','12 августа, следующая в феврале'],['pill','Витамины','С 1 октября, курс на месяц']].map(([i,t,s])=>`<div class="li"><span class="ic">${ic(i)}</span><div class="grow"><b>${t}</b><small>${s}</small></div></div>`).join('')}</div>
 <button class="btn o full press" data-shop="Здоровье">${ic('cross')}Заказать осмотр или витамины</button></div>`;

V.shop=()=>{const cats=['Все',...new Set(SHOP.map(p=>p.cat))],list=SHOP.filter(p=>S.shopCat==='Все'||p.cat===S.shopCat);
 return skySub('Магазин','Всё вручит конюх и пришлёт видео',`<button class="rb press" data-go="purchases" aria-label="Мои покупки">${ic('cart')}</button>`)+`<div class="stack">
 <div class="chips">${cats.map(c=>`<button class="chip ${S.shopCat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
 <div class="grid2">${list.map(p=>`<button class="glass prod press" data-prod="${p.id}"><div class="im${G3.includes(p.id)?' has3':''}">${G3.includes(p.id)?g3(p.id):ic(p.art,'width:44px;height:44px;stroke-width:1.4')}</div><b>${p.name}</b><span class="p">${rub(p.price)}</span></button>`).join('')}</div>
 <button class="btn o full press" data-go="purchases">Мои покупки</button></div>`};
V.purchases=()=>skySub('Мои покупки',`Снаряжение ${nm(S.horse,0)} и заказы`)+`<div class="stack">
 <div class="glass sec"><h2 style="margin-bottom:14px">У ${nm(S.horse,0)}</h2>${!gearOf(S.horse).length?`<p class="small">Снаряжения пока нет. Всё, что вы купите, конюх подпишет именем ${nm(S.horse,0)}.</p>`:''}${gearOf(S.horse).map(([i,n,s])=>`<div class="li"><span class="ic${G3.includes(i)?' g3w':''}">${G3.includes(i)?g3(i):ic(i)}</span><div class="grow"><b>${n}</b><small>${s}</small></div></div>`).join('')}</div>
 <div class="glass sec"><h2 style="margin-bottom:14px">Заказы</h2>${S.orders.map(([n,d,p,st,q])=>`<div class="li"><div class="grow"><b>${n}</b><small>${d}, ${q?tqStatus(q):st.toLowerCase()}</small></div><b>${rub(p)}</b></div>`).join('')}</div>
 <button class="btn v full press" data-shop="Все">В магазин</button></div>`;

V.buyout=()=>{const id=S.horse,val=VALUE[id],mo=S.months[id]||1,paid=pp(PLANS.find(x=>x.id===(S.subs[id]||'co')),id)*mo,off=paid/2,sum=val-off,b=S.buy,mon=Math.ceil(sum/12/100)*100;return skySub(`Выкуп ${nm(id,0)}`,`${fw(id,'Конь станет только вашим','Лошадь станет только вашей')}`)+`<div class="stack">
 <div class="glass sec"><div class="li"><div class="grow"><small>Стоимость ${fw(id,'коня','лошади')}</small></div><b>${rub(val)}</b></div><div class="li"><div class="grow"><small>Минус половина подписки за ${mo} ${mo===1?'месяц':mo<5?'месяца':'месяцев'}</small></div><b>−${rub(off)}</b></div><div class="li"><div class="grow"><b>К оплате</b>${b.pay?`<small>12 платежей, без переплаты</small>`:''}</div><span class="price" style="white-space:nowrap;flex:none">${rub(b.pay?mon:sum)}${b.pay?'<span style="font-size:15px;font-weight:600">&nbsp;/мес</span>':''}</span></div></div>
 <div class="glass sec"><h2 style="margin-bottom:12px">Где будет жить</h2>${[['Остаётся в Marali','Содержание 70 000 ₽ в месяц, камеры и отчёты сохраняются'],['Забираю домой','Перевозка по России от 40 000 ₽, документы оформим за две недели']].map(([t,d],k)=>`<button class="tr press" data-buyhome="${k}" style="width:100%;text-align:left"><span class="radio" ${b.home===k?'style="border-color:var(--g2)"':''}>${b.home===k?'<i style="width:12px;height:12px;border-radius:50%;background:var(--g2)"></i>':''}</span><div class="grow"><b>${t}</b><small>${d}</small></div></button>`).join('')}</div>
 <div class="glass sec"><h2 style="margin-bottom:12px">Оплата</h2><div class="seg">${['Сразу','Рассрочка на 12 мес'].map((t,k)=>`<button class="${b.pay===k?'on':''}" data-buypay="${k}">${t}</button>`).join('')}</div><p class="small" style="margin-top:12px">Договор подписывается электронно. Совладельцы ${nm(id,0)} получат уведомление и смогут выбрать другого коня.</p></div>
 <button class="btn v full press sticky" data-toast="Заявка отправлена, менеджер позвонит сегодня">Отправить заявку</button></div>`};

V.notif=()=>{S.unread=0;return skySub('Уведомления')+`<div class="stack"><div class="glass sec">${S.notifs.map(([i,t,s,d,g])=>`<button class="li press" data-go="${g}" style="width:100%;text-align:left"><span class="ic">${ic(i)}</span><div class="grow"><b>${esc(t)}</b><small>${esc(s)}</small></div><small>${d}</small></button>`).join('')}</div>${'Notification' in window&&Notification.permission!=='granted'?phoneCard():''}</div>`};

V.catalog=()=>{const f=['Все','Спокойные','Для прогулок','Выездка','Горные маршруты'],list=HORSES.filter(h=>S.catF==='Все'||h.tags.includes(S.catF)),g=1;
 const card=h=>{const mine=S.owner&&S.herd.includes(h.id),age=`${h.age} ${h.age<5?'года':'лет'}`;return `<button class="hcard press" data-go="horse/${h.id}"><div class="ph" style="background-image:url(${M}${h.id}.jpg)"></div>${mine?'<span class="tag pill dark">Ваш конь</span>':seatsBadge(h,g)}<div class="in"><h3>${h.name}</h3><p>${g?`${h.breed}, ${age}`:`${h.breed}, ${age}, ${h.color}. ${h.temper}`}</p><div class="row">${g?'':`<span class="small" style="color:#fff;opacity:.9">${h.walk}</span>`}<span class="pill" style="background:rgba(255,255,255,.9);color:var(--ink)">от ${rub(pp(PLANS[0],h.id))}${g?'/мес':'&nbsp;в мес'}</span></div></div></button>`};
 return skyTab('Каталог','150 коней Marali, 6 ищут владельцев')+`<div class="stack">
 <button class="glass quiz press" data-quiz><img src="${R3.t_horse}" alt=""><span class="grow"><b>Подобрать коня</b><small>Три вопроса о вас, и мы предложим подходящего</small></span><span class="btn v sm">Начать</span></button>
 <div class="chips">${f.map(c=>`<button class="chip ${S.catF===c?'on':''}" data-catf="${c}">${c}</button>`).join('')}</div>
 ${g?`<div class="cgrid">${list.map(card).join('')}</div>`:list.map(card).join('')}
 <button class="glass sec press" data-go="gift" style="text-align:left;display:flex;gap:14px;align-items:center"><span class="g3gift"><img src="${G3D.gift}" alt=""></span><div class="grow"><b>Подарить коня</b><br><span class="small">Сертификат на подписку для близкого</span></div>${ic('arrow','color:var(--off)')}</button></div>`};

V.horse=id=>{const h=H(id),p=PASS[id],mine=S.owner&&S.herd.includes(id);return `<section class="hero"><div class="ph" style="background-image:url(${M}${id}.jpg)"></div><div class="tp">${backBtn}<button class="rb press" aria-label="В избранное" data-toast="Добавили в избранное">${ic('heart')}</button></div><div class="nm"><h1>${h.name}</h1><p>${h.breed}, ${h.age} ${h.age<5?'года':'лет'}. ${h.temper}</p></div></section>
<div class="stack">
 <div class="glass sec"><p class="txt">${h.about}</p><div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px">${h.tags.map(t=>`<span class="pill">${t}</span>`).join('')}<span class="pill">${h.places>1?`Совладельцев до ${h.places}${mine?'':`, свободно ${seatInfo(h).free}`}`:'Только личный конь'}</span></div></div>
 <div class="cam${isNight()?' ir':''}" style="height:220px">${camMedia(isNight()?'stall':'pasture')}<div class="ov t"><span class="gp"><i class="dot"></i>${isNight()?`${fw(id,'Спит','Спит')} в деннике, ИК-камера`:'Сейчас на пастбище'}</span></div></div>
 <section class="glass sec"><h2 style="margin-bottom:16px">Паспорт</h2><div class="kv">${[['Порода',h.breed],['Пол',p.sex],['Возраст',h.age+(h.age<5?' года':' лет')],['Масть',h.color],['Рост в холке',h.h+' см'],['Вес',p.w+' кг'],['Родился',p.born],['Родители',p.par]].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div></section>
 <section class="glass sec"><div class="hd"><h2>Физическая форма</h2></div><p class="small">Полное кольцо означает норму породы</p>${rings(id,'info')}</section>
 <section class="glass sec"><h2 style="margin-bottom:14px">Кто за ${fw(id,'ним','ней')} ухаживает</h2>${Object.entries(STAFF).map(([k,s])=>`<button class="li press" data-go="staff/${k}"><span class="ava ph" style="background-image:url(${M}${s.img}.jpg)"></span><div class="grow"><b>${s.name}</b><small>${s.role}</small></div>${ic('arrow','color:var(--off)')}</button>`).join('')}</section>
 ${mine?`<button class="btn v full press sticky" data-myhorse="${id}">Перейти к ${nm(id,1)}</button>`:`<button class="btn v full press sticky" data-go="tariff/${id}">Выбрать тариф</button>`}</div>`};

V.staff=id=>{const s=STAFF[id];return `<section class="hero hs"><div class="ph" style="background-image:url(${M}${s.img}.jpg);background-position:center 20%"></div><div class="tp">${backBtn}<span></span></div><div class="nm"><h1 style="font-size:48px">${s.name.split(' ')[0]}</h1><p>${s.role} в Marali</p></div></section>
<div class="stack"><div class="glass sec" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${s.stats.map(([a,b])=>`<div><div class="price">${a}</div><small class="small">${b}</small></div>`).join('')}</div>
 <div class="glass sec"><p class="txt">${s.about}</p><div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px">${s.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div></div>
 <div class="deep">${mountMark}<p style="font-size:18px;max-width:none;margin:0;opacity:1;line-height:1.4">«${s.quote}»</p></div>
 <div class="glass sec"><h2 style="margin-bottom:16px">Обычный день</h2><div class="tl">${s.day.map(([t,d])=>`<div><b>${t}</b><small>${d}</small></div>`).join('')}</div></div>
 <button class="btn o full press" data-go="chat">${ic('chat')}Написать</button></div>`};

V.tariff=id=>{const h=H(id);return skySub('Тариф',`для ${nm(h.id,0)}`)+`<div class="stack">${PLANS.map(p=>`<button class="glass plan press ${S.pickPlan===p.id?'on':''}" data-plan="${p.id}"><div class="row"><div class="grow"><h2>${p.name}</h2><span class="price">${rub(pp(p,id))} <small>в месяц</small></span>${p.id==='co'&&!S.herd.includes(id)?`<small class="small" style="display:block;margin-top:4px">${(s=>s.free?`Свободно мест: ${s.free} из ${s.all}`:'Свободных мест нет')(seatInfo(h))}</small>`:''}</div><span class="radio"></span></div><ul>${p.pts.map(t=>`<li>${ic('check')}${t}</li>`).join('')}</ul></button>`).join('')}
 <button class="btn v full press sticky" data-go="pay/${id}">Продолжить за ${rub(pp(PLANS.find(p=>p.id===S.pickPlan),id))}</button></div>`};
V.pay=id=>{const h=H(id),p=PLANS.find(x=>x.id===S.pickPlan);return skySub('Оплата','Первый месяц подписки')+`<div class="stack">
 <div class="glass sec"><div class="staff"><span class="ava ph" style="background-image:url(${M}${id}.jpg)"></span><div class="grow"><b>${h.name}</b><small class="small">Тариф «${p.name}»</small></div><span class="price">${rub(pp(p,id))}</span></div></div>
 <div class="glass sec"><h2 style="margin-bottom:12px">Способ оплаты</h2>${[['card','Банковская карта','Мир, Visa, Mastercard'],['send','СБП','Через приложение банка'],['card','SberPay','В один тап']].map(([i,t,s],k)=>`<button class="li press" data-paym="${k}" role="radio" aria-checked="${(S.payM||0)===k}" style="width:100%;text-align:left"><span class="ic">${ic(i)}</span><div class="grow"><b>${t}</b><small>${s}</small></div><span class="radio" style="${(S.payM||0)===k?'border-color:var(--g2)':''}">${(S.payM||0)===k?'<i style="width:12px;height:12px;border-radius:50%;background:var(--g2)"></i>':''}</span></button>`).join('')}</div>
 <p class="small" style="padding:0 6px">Подписка продлевается раз в месяц. Отменить или поставить на паузу можно в профиле.</p>
 <button class="btn v full press sticky" data-paid="${id}">Оплатить ${rub(pp(p,id))}</button></div>`};
V.paid=id=>{const h=H(id),p=PLANS.find(x=>x.id===S.plan);return skySub('Покупка оформлена','Оплата прошла').replace('data-back',`data-myhorse="${id}"`)+`<div class="stack"><div class="glass sec" style="text-align:center;padding-top:22px"><span class="ph" style="display:block;width:112px;height:112px;border-radius:50%;margin:0 auto 16px;background-image:url(${M}${id}.jpg);background-size:cover;background-position:center;box-shadow:0 0 0 4px rgba(255,255,255,.8),0 10px 24px rgba(40,20,70,.2)"></span><h2>${h.name} теперь ${PASS[id].sex==='Кобыла'?'ваша':'ваш'}</h2><p class="small" style="margin:8px 0 18px">Вы оформили тариф «${p.name}» на ${nm(id,2)}. Конюх уже знает о вас и пришлёт первое видео сегодня вечером.</p><button class="btn v full press" data-myhorse="${id}">Перейти к ${nm(id,1)}</button></div></div>`};

V.gift=()=>{const G=[['1 мес','1 месяц',1,0],['3 мес','3 месяца',3,0],['6 мес','6 месяцев',6,5],['Год','год',12,10]],g=G[S.giftM],full=29000*g[2],sum=Math.round(full*(100-g[3])/100/100)*100;return skySub('Подарок','Сертификат на подписку')+`<div class="stack">
 <div class="deep gift" style="min-height:190px">${mountMark}<img class="gbox" src="${G3D.gift}" alt=""><span class="small" style="color:#fff;opacity:.8">Конешеринг, Marali</span><b class="t" style="font-size:30px;margin-top:30px">Свой конь на Алтае</b><p>Тариф «Совладелец» на ${g[1]}</p></div>
 <div class="glass sec"><h2 style="margin-bottom:12px">Срок</h2><div class="seg">${G.map((x,k)=>`<button class="${S.giftM===k?'on':''}" data-giftm="${k}">${x[0]}</button>`).join('')}</div>
 <label class="small" style="display:block;margin-top:16px" for="giftto">Кому</label><input class="field" id="giftto" style="margin-top:8px" value="Маме, Елене Викторовне"></div>
 <div class="glass sec">${g[3]?`<div class="li"><div class="grow"><small>${g[2]} × ${rub(29000)}</small></div><small style="text-decoration:line-through">${rub(full)}</small></div><div class="li"><div class="grow"><small>Скидка за срок</small></div><b>−${g[3]}%</b></div>`:''}<div class="li"><div class="grow"><b>К оплате</b><small>Коня получатель выберет сам</small></div><span class="price">${rub(sum)}</span></div></div>
 <button class="btn v full press sticky" data-giftpay="${sum}">Оплатить и отправить</button></div>`};

const GLS='.glass,.solid,.btn.o,.chip,.seg,.tr,.gear,.lvl,.medal i,.msg.in',PICS='img,video,canvas,.ph,[style*="background-image"]';
function flatScan(){for(const root of [document.getElementById('app'),...document.querySelectorAll('.sheet,.pop,.sv')]){if(!root)continue;
 const els=root.querySelectorAll(GLS);if(!els.length)continue;
 const pics=[...root.querySelectorAll(PICS)].map(e=>[e,e.getBoundingClientRect()]).filter(x=>x[1].width&&x[1].height);
 const rg=root.querySelector('.ridge'),G=rg&&rg.getBoundingClientRect(),gb=G?G.top+G.height*.5:0;
 for(const el of els){const R=el.getBoundingClientRect();if(!R.width)continue;let glass=false;

  else if(el.closest('.sky,.hero,.cam,.ph,.sticky,.cbar,.composer,[style*="background-image"]'))glass=true;
  else if(G&&R.top<gb&&R.bottom>G.top){
   /* над горами, но только если эту часть плашки не закрывает её же фото во всю ширину */
   let t=Math.max(R.top,G.top);const e=Math.min(R.bottom,gb);
   for(const [p,q] of pics)if(el.contains(p)&&q.width>=R.width*.9&&q.top<=t+1&&q.bottom>t)t=q.bottom;

new MutationObserver(ms=>{if(ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1)))flatScan()}).observe(document.body,{childList:true,subtree:true});
