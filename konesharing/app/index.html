<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2A2468"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Конешеринг</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap">
<style>
/* ---------- цветовые схемы ---------- */
.s1{--f:"Geologica",system-ui,sans-serif;--fd:"Geologica",system-ui,sans-serif;--hw:700;--r:28px;--rb:999px;
 --ink:#2E2227;--mute:#76676B;--off:#AE9FA0;--line:rgba(118,103,107,.18);--acc:#3E2A3A;--lk:#8A4F3E;
 --g1:#F1B97E;--g2:#C27A4E;--tint:#F7E7D8;--track:rgba(194,122,78,.15);--gold:#D9A21E;--goldt:#A86F0A;--shc:rgba(80,40,50,.45);--top:#3E2A3A;
 --sky:linear-gradient(180deg,#3E2A3A 0,#7B4B57 200px,#C98468 340px,#EDBA92 440px,#F6DFCB 560px,#F7EDE4 720px,#F4EEE8 100%);
 --skys:linear-gradient(180deg,#3E2A3A 0,#7B4B57 160px,#C98468 250px,#EDBA92 320px,#F6DFCB 420px,#F7EDE4 560px,#F4EEE8 100%);
 --deep:linear-gradient(160deg,#3E2A3A,#7B4B57 55%,#D39370)}
.s2{--f:"Wix Madefor Text",system-ui,sans-serif;--fd:"Wix Madefor Display",system-ui,sans-serif;--hw:700;--r:22px;--rb:14px;
 --ink:#2A211C;--mute:#7A6B60;--off:#B0A293;--line:rgba(122,107,96,.2);--acc:#33261E;--lk:#8C5E1E;
 --g1:#E8BF6A;--g2:#A9772F;--tint:#F3E7D3;--track:rgba(169,119,47,.15);--gold:#C99A2E;--goldt:#8C5E1E;--shc:rgba(70,45,25,.45);--top:#33261E;
 --sky:linear-gradient(180deg,#33261E 0,#6E4C37 200px,#B48858 340px,#E3C597 440px,#F2E6D3 560px,#F6EFE5 720px,#F3ECE2 100%);
 --skys:linear-gradient(180deg,#33261E 0,#6E4C37 160px,#B48858 250px,#E3C597 320px,#F2E6D3 420px,#F6EFE5 560px,#F3ECE2 100%);
 --deep:linear-gradient(160deg,#33261E,#6E4C37 55%,#C49A5E)}
.s3{--f:"Commissioner",system-ui,sans-serif;--fd:"Commissioner",system-ui,sans-serif;--hw:600;--r:18px;--rb:12px;
 --ink:#262221;--mute:#736A65;--off:#A9A099;--line:rgba(115,106,101,.2);--acc:#2E2A29;--lk:#7D6448;
 --g1:#D9BC94;--g2:#93744F;--tint:#EEE6DB;--track:rgba(147,116,79,.16);--gold:#BF9440;--goldt:#8A6528;--shc:rgba(40,34,30,.4);--top:#2E2A29;
 --sky:linear-gradient(180deg,#2E2A29 0,#5B524F 200px,#9E8D82 340px,#D6C6B6 450px,#ECE4D9 570px,#F2EEE8 720px,#EFEAE3 100%);
 --skys:linear-gradient(180deg,#2E2A29 0,#5B524F 160px,#9E8D82 250px,#D6C6B6 330px,#ECE4D9 430px,#F2EEE8 560px,#EFEAE3 100%);
 --deep:linear-gradient(160deg,#2E2A29,#5B524F 55%,#A8937F)}
.s4{--f:"Geologica",system-ui,sans-serif;--fd:"Geologica",system-ui,sans-serif;--hw:700;--r:30px;--rb:999px;
 --ink:#221E45;--mute:#625E80;--off:#A7A3C2;--line:rgba(98,94,128,.16);--acc:#2A2468;--lk:#5B4CE6;
 --g1:#FF9A7A;--g2:#7B5CE6;--tint:#F1EDFF;--track:rgba(91,76,230,.12);--gold:#F2A93B;--goldt:#B86E00;--shc:rgba(60,40,140,.45);--top:#2A2468;
 --sky:linear-gradient(180deg,#2A2468 0,#5B4CE6 210px,#C98BD0 360px,#FFD3C2 480px,#F6E9F5 640px,#E9EEFB 1100px,#E3F4EE 1900px,#EFEAFB 100%);
 --skys:linear-gradient(180deg,#2A2468 0,#5B4CE6 160px,#C98BD0 260px,#FFD3C2 340px,#F6E9F5 440px,#E9EEFB 700px,#EFEAFB 100%);
 --deep:linear-gradient(135deg,#2A2468,#5B4CE6 50%,#B45CE0 80%,#FF9A7A);
 --m1a:#9486EF;--m1b:#D0A6DE;--m2a:#7A6BE8;--m2b:#BC93DA;--m3a:#6455DE;--m3b:#A985D6}

.s5{--f:"Geologica",system-ui,sans-serif;--fd:"Geologica",system-ui,sans-serif;--hw:700;--r:30px;--rb:999px;
 --ink:#1F2622;--mute:#5F6657;--off:#A3A08C;--line:rgba(95,102,87,.18);--acc:#052E2A;--lk:#740F03;
 --g1:#B68B58;--g2:#740F03;--tint:#EFE8DA;--track:rgba(5,46,42,.12);--gold:#B68B58;--goldt:#7D4822;--shc:rgba(5,46,42,.42);--top:#052E2A;
 --sky:linear-gradient(180deg,#052E2A 0,#1D4A40 210px,#919179 360px,#D4C9B5 480px,#EDE6D8 640px,#F1ECE2 1100px,#E9ECE3 1900px,#F3EFE6 100%);
 --skys:linear-gradient(180deg,#052E2A 0,#1D4A40 160px,#919179 260px,#D4C9B5 340px,#EDE6D8 440px,#F1ECE2 700px,#F3EFE6 100%);
 --deep:linear-gradient(135deg,#052E2A,#293855 50%,#7D4822 80%,#B68B58);
 --m1a:#5D7E76;--m1b:#A3A592;--m2a:#40665E;--m2b:#8C9480;--m3a:#2A5048;--m3b:#77846F}
.sw{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(30,24,22,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px -10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .25s ease,opacity .25s ease}
.sw.hide{transform:translate(-50%,-150%);opacity:0}
.sw button{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);font:600 12.5px "Geologica",system-ui,sans-serif;padding:8px 9px;border-radius:999px;white-space:nowrap}
.sw button i{width:10px;height:10px;border-radius:50%}
.sw button.on{background:#fff;color:#000}
.swatch{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.swatch button{border-radius:calc(var(--r) - 10px);overflow:hidden;border:2px solid transparent;text-align:left;background:#fff}
.swatch button.on{border-color:var(--g2)}
.swatch span{display:block;height:58px}
.swatch b{display:block;font-size:13px;font-weight:600;padding:8px 10px}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--top);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;transition:background-color .3s}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:440px;margin:0 auto;min-height:100dvh;position:relative;background:var(--sky);overflow:clip}
.app.subp{background:var(--skys)}
@media (min-width:600px){.app{box-shadow:0 0 0 1px rgba(0,0,0,.05),0 40px 120px -40px rgba(0,0,0,.5)}}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ph{background:center/cover no-repeat;background-color:var(--tint)}
.grow{flex:1;min-width:0}.grow>small{display:block}
.row{display:flex;align-items:center;gap:12px}
.hscroll{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x pan-y;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.press{transition:transform .15s ease}
.press:active{transform:scale(.97)}
.arc{animation:draw 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--d)}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.arc,.fade{animation:none}.press:active{transform:none}}
.muted{color:var(--mute)}
.top-gap{height:calc(env(safe-area-inset-top,0px) + 62px)}

/* верх: небо */
.sky{position:relative;padding:0 22px 118px;color:#fff}
.sky .tp{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;min-height:44px}
.chipg{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 5px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:600;font-size:14px}
.chipg .a{width:30px;height:30px;border-radius:50%}
.rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);position:relative;flex:none}
.rb .n{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#E5533D;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.sky h1{font-family:var(--fd);font-size:76px;font-weight:var(--hw);letter-spacing:-.05em;line-height:.92;margin:24px 0 10px;position:relative;z-index:1}
.sky.t h1{font-size:54px;margin-top:20px}
.sky.s{padding-bottom:104px}
.sky.s h1{font-size:40px;letter-spacing:-.035em;margin:18px 0 6px}
.sky p{font-size:15px;font-weight:500;opacity:.88;position:relative;z-index:1}
.sky{z-index:0}:where(.sky ~ *){position:relative}.sky ~ *{z-index:1}
.ridge{position:absolute;left:0;right:0;bottom:-110px;height:340px;pointer-events:none;z-index:0}
.ridge svg{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 94%);mask-image:linear-gradient(180deg,#000 62%,transparent 94%)}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:0 14px 120px;margin-top:-94px;position:relative;z-index:2}
.stack>*{min-width:0}
.nobar .stack{padding-bottom:40px}

/* поверхности */
.glass{background:rgba(255,255,255,.52);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.55);border-radius:var(--r);box-shadow:0 22px 40px -26px var(--shc)}
.solid{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.8);border-radius:calc(var(--r) - 8px)}
.sec{padding:20px}
h2{font-family:var(--fd);font-size:22px;font-weight:var(--hw);letter-spacing:-.025em}
h3{font-size:16px;font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.hd+p{margin-top:-5px}
.lk{font-size:14px;font-weight:600;color:var(--lk)}
.txt{font-size:15px;color:var(--ink);line-height:1.55}
.small{font-size:13px;color:var(--mute);line-height:1.3}
small{line-height:1.25}
:where(small,span.small){display:inline-block}
.price+small,.big+small,.big+.small{display:block;margin-top:4px}
.deep p{line-height:1.35}
.btn{height:48px;padding:0 20px;border-radius:var(--rb);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.w{background:#fff;color:var(--ink)}
.btn.v{background:var(--acc);color:#fff;box-shadow:0 12px 22px -12px var(--shc)}
.btn.o{background:rgba(255,255,255,.6);border:1px solid var(--line);color:var(--ink)}
.btn.g{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.btn.full{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--tint);color:var(--g2)}
.pill.dark{background:var(--acc);color:#fff}
.gp{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.45);color:#fff;font-size:12.5px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#E5533D;box-shadow:0 0 0 3px rgba(229,83,61,.3)}
.ic{width:44px;height:44px;border-radius:calc(var(--r) - 12px);display:grid;place-items:center;background:var(--tint);color:var(--g2);flex:none}
.ic.lg{width:54px;height:54px}
.ic.grad{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 15px;border-radius:var(--rb);font-size:14px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:0 6px 14px -8px rgba(0,0,0,.25);flex:none}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);text-shadow:none}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(255,255,255,.5);border-radius:var(--rb);padding:4px;border:1px solid rgba(255,255,255,.75)}
.seg button{font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:var(--rb);color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li b{display:block;font-size:15px;font-weight:600}
.li small{display:block;font-size:13px;color:var(--mute)}
.chev{color:var(--off)}
.tr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:calc(var(--r) - 8px);background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.8);text-align:left;width:100%}
.tr+.tr{margin-top:8px}
.tr .th img{width:46px;height:46px;object-fit:contain}.tr .th.lk{position:relative}.tr .th.lk img{filter:grayscale(1);opacity:.45}.tr .th.lk svg{position:absolute;right:3px;bottom:3px;width:16px;height:16px;color:var(--mute)}
.tr .th{width:52px;height:52px;border-radius:calc(var(--r) - 14px);flex:none;display:grid;place-items:center;color:var(--g2);background-color:var(--tint);overflow:hidden}
.tr b{display:block;font-size:15px;font-weight:600}
.tr small{display:block;font-size:12.5px;color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.kv small{display:block;font-size:12px;color:var(--mute)}
.kv b{font-size:15.5px;font-weight:600}
.field{display:block;width:100%;height:56px;border-radius:calc(var(--r) - 8px);border:1px solid var(--line);background:rgba(255,255,255,.85);padding:0 18px;font-size:18px;outline:none}
.field:focus{border-color:var(--g2)}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:8}

/* камера */
.cam{position:relative;height:280px;border-radius:calc(var(--r) + 2px);overflow:hidden;border:5px solid rgba(255,255,255,.5);box-shadow:0 34px 50px -26px var(--shc);background:#222 padding-box}
.cam video,.cam .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(20,14,12,.7));pointer-events:none}
.cam .ov{position:absolute;z-index:2}
.cam .t{top:14px;left:14px;right:14px;display:flex;justify-content:space-between}
.cam .b{left:16px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:10px}
.cam .b small{font-size:13px;font-weight:500;opacity:.92;line-height:1.3}

/* главная */
.stat{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 6px}
.stat>button{padding:0 12px;border-left:1px solid var(--line);text-align:left}
.stat>button:first-child{border-left:0}
.stat svg{color:var(--g2);margin-bottom:10px}
.stat small{display:block;font-size:12px;font-weight:500;color:var(--mute)}
.stat b{font-size:17px;font-weight:600}
.treat{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px}
.treat b{font-size:16px;font-weight:600;display:block}
.treat small{font-size:13px;color:var(--mute)}
.g3{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(60,35,20,.18));transition:transform .5s cubic-bezier(.2,.8,.2,1)}.press:active .g3{transform:scale(.96) rotate(-2deg)}
.im.has3{display:block;position:relative;background:radial-gradient(120% 90% at 50% 35%,#fff 0%,var(--tint) 70%);overflow:hidden}.im.has3 .g3{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.ic.g3w{width:56px;height:56px;background:radial-gradient(#fff,var(--tint));padding:4px;overflow:hidden}
.gear{width:150px;flex:none;display:flex;flex-direction:column;justify-content:flex-start;background:rgba(255,255,255,.7);border-radius:calc(var(--r) - 8px);padding:8px 8px 12px;border:1px solid rgba(255,255,255,.8);text-align:left}
.gear .im{height:124px;border-radius:calc(var(--r) - 14px);display:grid;place-items:center;color:var(--g2);margin-bottom:10px;background:var(--tint)}
.gear b{display:block;font-size:13px;font-weight:600;line-height:1.25;padding:0 4px}
.gear small{display:block;font-size:12px;color:var(--mute);padding:2px 4px 0}
.lvl{display:flex;align-items:center;gap:14px;padding:12px;border-radius:calc(var(--r) - 8px);background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.8)}
.lvl .lv{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--g1),var(--g2) 75%,var(--track) 0);display:grid;place-items:center;flex:none}
.lvl .lv b{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 6px;margin-top:20px}
.ring{text-align:center}
.ring svg{width:86px;height:86px;display:block;margin:0 auto}
.ring .v{font:700 20px var(--fd);fill:var(--ink);letter-spacing:-.02em}
.ring .u{font:500 10px var(--f);fill:var(--mute)}
.ring b{display:block;font-size:12.5px;font-weight:600;margin-top:4px}
.ring small{display:block;font-size:11px;line-height:1.25;color:var(--mute);margin-top:1px}
.ring.gold small,.ring.max small{color:var(--goldt);font-weight:600}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.medal{text-align:center;font-size:12px;font-weight:600;color:var(--off)}
.medal i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 7px;border-radius:50%;background:rgba(255,255,255,.45);border:1.5px dashed var(--line);color:var(--off)}
.medal.on{color:var(--ink)}
.m3{display:block;width:62px;height:80px;object-fit:contain;margin:0 auto 6px;filter:drop-shadow(0 8px 10px rgba(40,30,110,.28))}
.medal:not(.on) .m3,.m3.off{filter:grayscale(1) brightness(1.15) contrast(.8);opacity:.5}
.m3.big{width:120px;height:150px;margin:0 auto 10px}
.medal.on i{color:#fff;border:0;background:linear-gradient(140deg,var(--g1),var(--g2));box-shadow:0 12px 20px -10px var(--shc),inset 0 0 0 3px rgba(255,255,255,.3)}
.ev .d{width:52px;height:52px;border-radius:calc(var(--r) - 14px);display:grid;place-items:center;align-content:center;line-height:1;background-color:var(--tint);color:var(--g2);flex:none}
.ev .d b{font-size:19px;font-weight:700;font-family:var(--fd)}
.ev .d small{font-size:11px;font-weight:600;margin-top:3px;color:inherit}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q{padding:16px;display:flex;flex-direction:column;gap:24px;text-align:left}
.q svg{color:var(--g2)}
.q b{font-size:16px;font-weight:600;display:block}
.q small{font-size:12.5px;color:var(--mute)}
.deep{border-radius:calc(var(--r) + 2px);padding:22px;color:#fff;background:var(--deep);box-shadow:0 26px 40px -22px var(--shc);position:relative;overflow:hidden;text-align:left}
.deep svg.m{position:absolute;right:-10px;bottom:-6px;width:240px;height:90px;opacity:.2}
.deep>*:not(svg){position:relative}
.deep b.t{font-family:var(--fd);font-size:24px;font-weight:var(--hw);display:block;letter-spacing:-.02em}
.deep p{margin:6px 0 16px;font-size:14px;opacity:.88;max-width:30ch}

/* каталог и карточки */
.hcard{position:relative;display:block;width:100%;height:300px;border-radius:calc(var(--r) + 2px);overflow:hidden;text-align:left;box-shadow:0 26px 40px -24px var(--shc);color:#fff}
.hcard .ph{position:absolute;inset:0}
.hcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(20,14,12,.78))}
.hcard .in{position:absolute;z-index:2;left:18px;right:18px;bottom:16px}
.hcard .in h3{font-family:var(--fd);font-size:34px;font-weight:var(--hw);letter-spacing:-.03em;line-height:1}
.hcard .in p{font-size:13.5px;opacity:.9;margin-top:4px}
.hcard .in .row{margin-top:12px;justify-content:space-between}
.hcard .tag{position:absolute;z-index:2;top:14px;left:14px}
.hero{position:relative;height:400px;color:#fff;margin-bottom:16px}
.hero .ph,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 45%,var(--top) 100%)}
.hero .tp{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 62px);left:22px;right:22px;display:flex;justify-content:space-between}

.hero .nm h1{font-family:var(--fd);font-size:68px;font-weight:var(--hw);letter-spacing:-.05em;line-height:.92}
.hero .nm p{font-size:15px;opacity:.9;margin-top:8px}
.hero+.stack{margin-top:0}
b:has(+br+:is(small,.small)){display:block;line-height:1.3}b+br:has(+:is(small,.small)){display:none}b+br+:is(small,.small){display:block;margin-top:2px}
.staff{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.ava{width:52px;height:52px;border-radius:50%;flex:none}
.plan{display:block;width:100%;text-align:left;padding:18px;border:2px solid transparent}
.plan.on{border-color:var(--g2)}
.plan ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.plan li{display:flex;gap:8px;font-size:14px}
.plan li svg{color:var(--g2);width:18px;height:18px;margin-top:2px}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.plan.on .radio{border-color:var(--g2)}
.plan.on .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--g2)}
.price{font-family:var(--fd);font-size:26px;font-weight:var(--hw);letter-spacing:-.02em}
.price small{font-family:var(--f);font-size:13px;color:var(--mute);font-weight:500;letter-spacing:0}

/* магазин */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.map{display:block;width:100%;height:auto;border-radius:calc(var(--r) - 8px)}

.msgs{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-height:calc(100dvh - env(safe-area-inset-top,0px) - 280px)}

/* таббар */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(min(100vw,440px) - 28px);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 4px 8px;background:rgba(255,255,255,.62);backdrop-filter:blur(10px) saturate(1.8);-webkit-backdrop-filter:blur(10px) saturate(1.8);border:1px solid rgba(255,255,255,.6);border-radius:var(--r);box-shadow:0 14px 30px -12px var(--shc);color:var(--mute)}

 return `<button class="ring press ${s.max?'max':''} ${s.gold?'gold':''}" ${tap?`data-train="${s.k}"`:''} aria-label="${s.name}: ${s.v} ${s.u}, ${sub}"><svg viewBox="0 0 80 80">${k?'':`<defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${getVar('--g1')}"/><stop offset="1" stop-color="${getVar('--g2')}"/></linearGradient></defs>`}<circle cx="40" cy="40" r="34" fill="none" stroke="var(--track)" stroke-width="8"/>${arc(40,34,8,col,Math.min(1,s.p/100))}<text x="40" y="43" text-anchor="middle" class="v">${s.v}</text><text x="40" y="57" text-anchor="middle" class="u">${s.u}</text></svg><b>${s.short}</b><small>${sub}</small></button>`}).join('')}</div>`}

 ${S.club===2?`<div class="glass sec fade"><p class="small" style="margin-bottom:12px">Очки за тренировки, трюки и километры за октябрь</p>${RATING.map(([id,pt],k)=>`<div class="li" style="${id===S.horse?'background:var(--tint);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:14px':''}"><b style="width:22px">${k+1}</b><span class="ava ph" style="width:44px;height:44px;background-image:url(${M}${id}.jpg)"></span><div class="grow"><b>${H(id).name}${id===S.horse?' (ваш)':''}</b><small>${H(id).breed}</small></div><b>${pt}</b></div>`).join('')}</div>`:''}</div>`;

V.profile=()=>{const p=PLANS.find(x=>x.id===S.plan);return skyTab('Профиль','Анна Королёва, +7 913 ••• 42 18')+`<div class="stack">
 <div class="glass sec"><div class="staff"><span class="ava ph" style="background-image:url(${M}grom.jpg)"></span><div class="grow"><b>Гром, «${p.name}»</b><small class="small">${S.paused?'Подписка на паузе':'Следующее списание 5 ноября'}</small></div><span class="price" style="font-size:20px">${rub(p.price)}</span></div>
  <div class="row" style="margin-top:14px"><button class="btn o sm grow press" data-go="tariff/grom">Сменить тариф</button><button class="btn o sm grow press" data-pause>${ic('pause','width:16px;height:16px')}${S.paused?'Продолжить':'Пауза'}</button></div></div>
 <div class="glass sec">${[['bell','Уведомления','notif'],['card','История платежей','payments'],['chat','Чат с менеджером','chat'],['cal','Мои брони','bookings'],['gift','Подарить сертификат','gift']].map(([i,t,g])=>`<button class="li press" data-go="${g}"><span class="ic">${ic(i)}</span><b class="grow">${t}</b>${ic('arrow','color:var(--off)')}</button>`).join('')}</div>
 <div class="glass sec"><h2 style="margin-bottom:12px">Цветовая схема</h2><div class="swatch">${[['4','Аврора','linear-gradient(160deg,#2A2468,#5B4CE6,#C98BD0,#FFD3C2)'],['5','Marali','linear-gradient(160deg,#052E2A,#293855,#7D4822,#B68B58,#D4C9B5)']].map(([k,n,g])=>`<button class="press ${S.scheme===k?'on':''}" data-s="${k}"><span style="background:${g}"></span><b>${n}</b></button>`).join('')}</div></div>
 <button class="btn o full press" data-logout>${ic('out')}Выйти</button></div>`};
V.payments=()=>skySub('Платежи')+`<div class="stack"><div class="glass sec">${[['Подписка «Совладелец»','5 октября',29000],['Недоуздок с гравировкой','5 октября',6900],['Яблоки, 1 кг','4 октября',350],['СПА-день','28 сентября',4500],['Подписка «Совладелец»','5 сентября',29000]].map(([t,d,p])=>`<div class="li"><div class="grow"><b>${t}</b><small>${d}</small></div><b>${rub(p)}</b></div>`).join('')}</div></div>`;
V.chat=()=>skySub('Ольга','Менеджер Marali, обычно отвечает за 5 минут')+`<div class="stack" style="padding-bottom:30px"><div class="msgs" id="msgs">${S.chat.map(([w,t,d])=>`<div class="msg ${w}">${esc(t)}<small>${d}</small></div>`).join('')}</div>
 <form class="composer glass" data-send><input id="msg" placeholder="Сообщение" autocomplete="off"><button class="btn v sm" aria-label="Отправить">${ic('send')}</button></form></div>`;

/* ---------- роутер ---------- */
const TABS=[['catalog','Каталог','grid'],['trips','Поездки','mount'],['home','Мой конь','horse'],['club','Клуб','club'],['profile','Профиль','user']];
const TAB_OF={home:'home',cams:'home',report:'home',stats:'home',health:'home',shop:'home',purchases:'home',buyout:'home',notif:'home',catalog:'catalog',horse:'catalog',staff:'catalog',tariff:'catalog',gift:'catalog',trips:'trips',tour:'trips',bookings:'trips',club:'club',profile:'profile',payments:'profile'};
const NO_TABS=['welcome','login','code','pay','paid','book','chat','tour','horse','staff','tariff','buyout','gift'];
const ROOTS=['home','catalog','trips','club','profile','welcome'];
function render(){let r=(location.hash.replace(/^#\/?/,'')||'home').split('/');let [n,arg]=r;if(!V[n])n='home';
 if(!S.owner&&['home','cams','report','stats','health','purchases','buyout','profile'].includes(n)){n='welcome'}
 const app=document.getElementById('app');app.className='app'+(ROOTS.includes(n)?'':' subp')+(NO_TABS.includes(n)?' nobar':'');
 app.innerHTML=V[n](arg);
 const tb=document.getElementById('tabbar'),t=TAB_OF[n];tb.style.display=NO_TABS.includes(n)?'none':'grid';
 const TI={catalog:'t_grid',trips:'t_trips',club:'t_club',profile:'t_user'};tb.innerHTML=TABS.map(([k,l,i])=>k==='home'?`<button class="main ${k===t?'on':''}" data-go="${k}" aria-label="${l}"><span class="orb"><img class="t3h" src="${R3.t_horse}" alt=""></span>${l}</button>`:`<button class="${k===t?'on':''}" data-go="${k}"><img class="t3" src="${R3[TI[k]]}" alt="">${l}</button>`).join('');
 parallax();
 if(n==='chat'){const m=document.getElementById('msgs');m&&m.lastElementChild&&m.lastElementChild.scrollIntoView({block:'end'})}
}

function go(r){if(location.hash==='#/'+r){render();return}location.hash='/'+r;window.scrollTo(0,0)}
function rerender(){const y=scrollY;render();window.scrollTo(0,y)}
addEventListener('hashchange',()=>{closeSheet();render();window.scrollTo(0,0)});

/* ---------- шторки, тосты ---------- */
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function sheet(html){const s=document.getElementById('sheet');s.innerHTML='<div class="grab"></div>'+html;s.classList.add('on');document.getElementById('scrim').classList.add('on')}
function closeSheet(){document.getElementById('sheet').classList.remove('on');document.getElementById('scrim').classList.remove('on');const v=document.querySelector('#sheet video');v&&v.pause()}
document.getElementById('scrim').onclick=closeSheet;addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function trainSheet(k){const s=stats(S.horse).find(x=>x.k===k),gp=Math.max(0,Math.min(6,s.c-s.p)),gain=Math.round(s.norm*gp/100),cur=S.training&&stats(S.horse).find(x=>x.k===S.training);
 const btn=s.max?`<button class="btn o full" disabled>Прокачано полностью</button>`:S.training===k?`<button class="btn o full" disabled>Идёт курс, неделя 1 из 3</button>`:cur?`<button class="btn o full" disabled>Сейчас идёт курс «${cur.name}»</button><p class="small" style="margin-top:10px;text-align:center">Тренер ведёт один курс за раз</p>`:`<button class="btn v full press" data-course="${k}">Начать курс за ${rub(7500)}</button>`;
 sheet(`<h2>${s.name}</h2><p class="small">Курс тренировок с Мариной, 3 недели</p><div class="glass sec" style="margin:16px 0;background:#fff"><div class="kv"><div><small>Сейчас</small><b>${s.v} ${s.u}</b></div><div><small>Норма породы</small><b>${s.norm} ${s.u}</b></div><div><small>Предел по ветеринару</small><b>${s.cap} ${s.u}</b></div><div><small>За курс</small><b>${s.max?'—':`+${gain} ${s.u}`}</b></div></div></div>${btn}`)}
function startCourse(k){const h=S.horse,s0=stats(h).find(x=>x.k===k),gp=Math.max(0,Math.min(6,s0.c-s0.p));closeSheet();S.training=k;render();toast(`Курс «${s0.name}» начат. Марина пришлёт видео с занятий`);
 setTimeout(()=>{if(S.training!==k)return;S.boost[h+k]=(S.boost[h+k]||0)+gp;S.training=null;S.xp+=300;render();const s1=stats(h).find(x=>x.k===k);
  const a=document.querySelector(`.ring[data-train="${k}"] .arc`);if(a){const C=2*Math.PI*34;a.style.setProperty('--d',((Math.min(1,s1.p/100)-Math.min(1,s0.p/100))*C).toFixed(1));document.querySelectorAll('.rings .arc').forEach(x=>{if(x!==a)x.style.animation='none'})}
  toast(`Курс завершён: ${s1.name.toLowerCase()} теперь ${s1.v} ${s1.u}. +300 XP`)},4500)}
function medalSheet(k){const m=MED[k];sheet(`<div style="text-align:center"><img class="m3 big ${m[2]?'':'off'}" src="${R3[MIMG[k]]}" alt=""><h2>${m[0]}</h2><p class="small">${m[2]?'Получена':'Пока не получена'}</p></div><div class="glass sec" style="margin-top:16px;background:#fff"><div class="li"><div class="grow"><small>Условие</small><b>${m[3]}</b></div></div><div class="li"><div class="grow"><small>Награда</small><b>${m[4]}</b></div></div>${m[5]?`<div class="li"><div class="grow"><small>Прогресс</small><b>${m[5][0]} из ${m[5][1]}</b></div></div>`:''}</div>`)}
function trickSheet(){sheet(`<h2>Шаг по команде</h2><p class="small" style="margin-bottom:14px">Освоен 2 октября, занятия вела Марина</p><video class="video" src="${M}arena.mp4" poster="${M}arena.jpg" controls autoplay muted playsinline></video>`)}
function treatSheet(){sheet(`<h2>Угостить Грома</h2><p class="small" style="margin-bottom:14px">Конюх вручит сегодня и снимет видео</p>${SHOP.filter(p=>p.cat==='Лакомства').map(p=>`<button class="li press" data-close-toast="${p.name.split(',')[0]} для Грома оплачены, видео пришлём вечером"><span class="ic">${ic(p.art)}</span><div class="grow"><b>${p.name}</b><small>${p.info}</small></div><b>${rub(p.price)}</b></button>`).join('')}<button class="btn o full press" style="margin-top:16px" data-shop="Все">Весь магазин</button>`)}
function prodSheet(id){const p=SHOP.find(x=>x.id===id);sheet(`<div class="prod" style="padding:0"><div class="im${G3.includes(p.id)?' has3':''}" style="height:${G3.includes(p.id)?220:160}px">${G3.includes(p.id)?g3(p.id):ic(p.art,'width:60px;height:60px;stroke-width:1.3')}</div></div><h2 style="margin-top:16px">${p.name}</h2><p class="txt" style="margin-bottom:16px">${p.info}</p><button class="btn v full press" data-order="${p.id}">Купить за ${rub(p.price)}</button>`)}

/* ---------- клики ---------- */
function setScheme(k){S.scheme=k;document.body.className='s'+k;try{localStorage.setItem('kn-scheme',k)}catch(e){}
 document.querySelectorAll('.sw button').forEach(b=>b.classList.toggle('on',b.dataset.s===k));document.querySelector('meta[name=theme-color]').content=getVar('--top');rerender()}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-go],[role=button]');if(!t)return;const d=t.dataset;
 if(d.call!==undefined){e.stopPropagation();toast('Алексей позовёт Грома к камере');return}
 if(d.s){setScheme(d.s);return}
 if(d.back!==undefined){history.length>1?history.back():go('home');return}
 if(d.go){go(d.go);return}
 if(d.train){trainSheet(d.train);return}
 if(d.course){startCourse(d.course);return}
 if(d.medal){medalSheet(+d.medal);return}
 if(d.trick){trickSheet();return}
 if(d.treat!==undefined){treatSheet();return}
 if(d.shop){S.shopCat=d.shop;closeSheet();go('shop');return}
 if(d.cat){S.shopCat=d.cat;rerender();return}
 if(d.catf){S.catF=d.catf;rerender();return}
 if(d.prod){prodSheet(d.prod);return}
 if(d.order){const p=SHOP.find(x=>x.id===d.order);S.orders.unshift([p.name,'7 октября',p.price,'Оформлен']);closeSheet();toast('Заказ оформлен, конюх вручит и пришлёт видео');return}
 if(d.closeToast){closeSheet();toast(d.closeToast);return}
 if(d.toast){toast(d.toast);return}
 if(d.ev){S.ev=+d.ev;document.getElementById('evbox').innerHTML=events();return}
 if(d.cam){S.cam=+d.cam;rerender();return}
 if(d.st){S.stats=+d.st;rerender();return}
 if(d.club){S.club=+d.club;rerender();return}
 if(d.plan){S.pickPlan=d.plan;rerender();return}
 if(d.paid){S.owner=true;S.horse=d.paid;S.plan=S.pickPlan;toast('Оплата прошла');go('paid/'+d.paid);return}
 if(d.dep){S.dep=+d.dep;rerender();return}
 if(d.ppl){S.people=Math.max(1,Math.min(6,S.people+ +d.ppl));rerender();return}
 if(d.book!==undefined){S.bookings.unshift(['Тур «Кержаки»',`${DEPS[S.dep][0]} 2027, ${S.people} чел.`]);toast('Тур забронирован');go('bookings');return}
 if(d.pause!==undefined){S.paused=!S.paused;rerender();toast(S.paused?'Подписка на паузе до 5 декабря':'Подписка снова активна');return}
 if(d.logout!==undefined){S.owner=false;go('welcome');return}
 if(d.login!==undefined){S.owner=true;go('home');return}
 if(d.seg){return}
 if(t.parentElement&&t.parentElement.classList.contains('seg')){t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t))}
});
document.addEventListener('submit',e=>{if(!e.target.matches('[data-send]'))return;e.preventDefault();const i=document.getElementById('msg');const v=i.value.trim();if(!v)return;
 S.chat.push(['out',v,'сейчас']);rerender();setTimeout(()=>{S.chat.push(['in','Спасибо! Уточню у Алексея и отвечу в течение пяти минут.','сейчас']);if(location.hash.includes('chat'))rerender()},1200)});
{const ua=navigator.userAgent;if(/iPhone|iPad|iPod/.test(ua)||(/AppleWebKit/.test(ua)&&!/Chrome|Chromium|Edg|OPR/.test(ua))||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))document.documentElement.classList.add('wk');if(/Android/.test(ua))document.documentElement.classList.add('an')}
try{const k=localStorage.getItem('kn-scheme');if(k==='4'||k==='5')S.scheme=k}catch(e){}
if(/[?&]theme=marali/i.test(location.search))S.scheme='5';
let ly=0;addEventListener('scroll',()=>{const y=scrollY;document.querySelector('.sw').classList.toggle('hide',y>ly&&y>80);ly=y},{passive:true});
document.body.className='s'+S.scheme;document.querySelectorAll('.sw button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.scheme));
document.querySelector('meta[name=theme-color]').content=getVar('--top');
render();
</script>
</body></html>
