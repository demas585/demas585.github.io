button:focus-visible,a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
h1,h2,h3,p{margin:0}
.app{max-width:440px;margin:0 auto;min-height:100dvh}
@media (min-width:600px){.app{box-shadow:0 0 0 1px rgba(0,0,0,.05),0 40px 120px -40px rgba(0,0,0,.35)}}
.screen{min-height:100dvh;position:relative;overflow:clip}
.sb{height:calc(env(safe-area-inset-top,0px) + 60px)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ph{background:center/cover no-repeat}
.p-pasture{background-image:var(--img-pasture)}.p-grom{background-image:var(--img-grom)}.p-arena{background-image:var(--img-arena)}.p-stall{background-image:var(--img-stall)}.p-pov{background-image:var(--img-pov)}
.grow{flex:1;min-width:0}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tabbar{position:sticky;z-index:9;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);margin:0 14px calc(env(safe-area-inset-bottom,0px) + 12px);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 4px 8px}
.tabbar span{display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:600}
.tabbar svg.i{width:22px;height:22px}
.press{transition:transform .15s ease}
.press:active{transform:scale(.97)}
.arc{animation:draw 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--d)}}
@media (prefers-reduced-motion:reduce){.arc{animation:none}.press:active{transform:none}body{transition:none}}
.v1 .wrap,.v3 .stack{grid-template-columns:minmax(0,1fr)}
.v1 .wrap>*,.v3 .stack>*{min-width:0}
.ev{display:flex;gap:12px;align-items:center}
.ev b{display:block}

/* switcher */
.sw{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(24,26,25,.78);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px -10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1);max-width:calc(100vw - 24px);transition:transform .25s ease,opacity .25s ease}
.sw.hide{transform:translate(-50%,-150%);opacity:0}
.sw button{color:rgba(255,255,255,.7);font:600 13px "Golos Text",system-ui,sans-serif;padding:9px 13px;border-radius:999px;white-space:nowrap}
.sw button.on{background:#fff;color:#000}
@media (max-width:360px){.sw button{padding:8px 9px;font-size:12px}}

/* ================= 1 · БЕНТО — Golos Text ================= */
.v1{--bg:#EEF1EC;--card:#fff;--ink:#12201A;--mute:#5E6A64;--line:#E4E8E3;--pine:#1F5A3D;--pine-d:#143D29;--mint:#DDEBE1;--sky:#DCE8F3;--hay:#F3E8CF;--rose:#F5E1DC;
 --sh:0 1px 1px rgba(18,32,26,.04),0 8px 18px -8px rgba(18,32,26,.12),0 26px 44px -30px rgba(18,32,26,.22);
 background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,sans-serif}
.v1 .wrap{padding:0 16px 24px;display:grid;gap:28px}
.v1 .top{display:flex;align-items:center;gap:12px;padding:4px 4px 0}
.v1 .ava{width:48px;height:48px;border-radius:16px;box-shadow:0 0 0 3px #fff}
.v1 .top p{font-size:13px;color:var(--mute);font-weight:500}
.v1 .top h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.v1 .ib{width:46px;height:46px;border-radius:16px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;position:relative}
.v1 .ib::after{content:"";position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:#E0533C;box-shadow:0 0 0 2px #fff}
.v1 .bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.v1 .bento>*{min-width:0}
.v1 .t6{grid-column:span 6}.v1 .t3{grid-column:span 3}
.v1 .r2{grid-row:span 2}
.v1 .cam{position:relative;height:300px;border-radius:30px;overflow:hidden;box-shadow:0 30px 50px -28px rgba(18,32,26,.55)}
.v1 .cam::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 30%,transparent 50%,rgba(0,0,0,.62))}
.v1 .cam>*{position:absolute;z-index:2}
.v1 .badge{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.94);color:var(--ink)}
.v1 .badge.g{background:rgba(0,0,0,.32);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.v1 .dot{width:7px;height:7px;border-radius:50%;background:#E0533C;box-shadow:0 0 0 3px rgba(224,83,60,.25)}
.v1 .cam .tl{top:14px;left:14px;right:14px;display:flex;justify-content:space-between}
.v1 .cam .bl{left:18px;right:14px;bottom:16px;display:flex;align-items:flex-end;gap:12px;color:#fff}
.v1 .cam .bl b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}
.v1 .cam .bl small{font-size:13px;opacity:.85}
.v1 .btn{height:46px;padding:0 18px;border-radius:15px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.v1 .btn.w{background:#fff;color:var(--ink)}
.v1 .btn.l{background:#fff;color:var(--pine-d)}
.v1 .tile{border-radius:24px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:96px}
.v1 .tile .ic{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center}
.v1 .tile small{display:block;font-size:12.5px;color:var(--mute);font-weight:500}
.v1 .tile b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.v1 .tile.big b{font-size:25px;letter-spacing:-.03em}
.v1 .tile .x{font-size:12.5px;color:var(--mute);margin-top:4px}
.v1 .treat{border-radius:24px;padding:14px 14px 14px 16px;background:var(--pine-d);color:#fff;display:flex;align-items:center;gap:14px}
.v1 .treat .ic{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#F6B6A6;flex:none}
.v1 .treat b{font-size:16px;display:block}
.v1 .treat small{font-size:13px;opacity:.72}
.v1 .sh{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;margin-bottom:12px}
.v1 h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
.v1 .lk{font-size:14px;font-weight:600;color:var(--pine)}
.v1 .cnt{font-size:14px;color:var(--mute)}
.v1 .gear{width:146px;flex:none;background:var(--card);border-radius:22px;padding:8px 8px 14px;box-shadow:var(--sh)}
.v1 .gear .im{height:112px;border-radius:16px;display:grid;place-items:center;margin-bottom:12px;color:#5B4027}
.v1 .gear b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;padding:0 6px}
.v1 .gear .st{display:flex;align-items:baseline;gap:6px;margin:8px 6px 0;font-size:12px;font-weight:500;color:var(--mute)}
.v1 .gear .st i{width:6px;height:6px;border-radius:50%;flex:none;transform:translateY(-1px)}
.v1 .card{background:var(--card);border-radius:30px;box-shadow:var(--sh);padding:20px}
.v1 .card .sh{padding:0;margin-bottom:14px}
.v1 .lvl b{font-size:16px}
.v1 .lvl .n{font-size:13px;color:var(--mute)}
.v1 .xp{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}
.v1 .xp i{display:block;height:100%;width:75%;border-radius:8px;background:var(--pine)}
.v1 .act{display:block;width:220px;height:220px;margin:20px auto 14px}
.v1 .act .c1{font:800 42px "Golos Text",sans-serif;fill:var(--ink);letter-spacing:-.04em}
.v1 .act .c2{font:500 11px "Golos Text",sans-serif;fill:var(--mute)}
.v1 .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.v1 .lg{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:16px;background:#F4F6F3}
.v1 .lg i{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}
.v1 .lg small{display:block;font-size:12px;color:var(--mute)}
.v1 .lg b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.v1 .lg em{font-style:normal;font-size:11.5px;color:var(--mute)}
.v1 .lg.gold em,.v1 .lg.max em{color:#94700C;font-weight:600}
.v1 .hint{font-size:12.5px;color:var(--mute);text-align:center;margin-top:12px}
.v1 .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.v1 .sh+.row,.v1 .evs .row:first-child{border-top:0;padding-top:2px}
.v1 .row:last-child{padding-bottom:0}
.v1 .th{width:54px;height:54px;border-radius:16px;flex:none;display:grid;place-items:center;background-color:#F2F4F1;color:var(--mute)}
.v1 .row b{display:block;font-size:15px;font-weight:600}
.v1 .row small{font-size:13px;color:var(--mute)}
.v1 .mini{height:5px;border-radius:5px;background:var(--line);margin-top:7px;overflow:hidden;width:70%}
.v1 .mini i{display:block;height:100%;background:#2E7BC4;border-radius:5px}
.v1 .chip{height:36px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.v1 .medals{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.v1 .medal{text-align:center;font-size:12px;font-weight:600;color:#9AA39E}
.v1 .medal i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 7px;border-radius:20px;background:#F2F4F1;color:#BCC3BE}
.v1 .medal.on{color:var(--ink)}
.v1 .medal.on i{color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 8px 16px -8px rgba(0,0,0,.4)}
.v1 .seg{display:grid;grid-template-columns:1fr 1fr;background:#F0F2EF;border-radius:14px;padding:4px;margin-bottom:10px}
.v1 .seg button{font-size:13.5px;font-weight:600;padding:9px;border-radius:11px;color:var(--mute)}
.v1 .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.14)}
.v1 .ev .d{width:54px;height:56px;border-radius:16px;background-color:#F2F4F1;display:grid;place-items:center;align-content:center;line-height:1;flex:none}
.v1 .ev .d b{font-size:20px;font-weight:800}
.v1 .ev .d small{font-size:11px;margin-top:4px}
.v1 .ev .d.ph{color:#fff}
.v1 .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v1 .q{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:26px;text-align:left}
.v1 .q .ic{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.75);display:grid;place-items:center}
.v1 .q b{display:block;font-size:16px;font-weight:700}
.v1 .q small{font-size:12.5px;color:var(--mute)}
.v1 .buy{position:relative;border-radius:30px;overflow:hidden;min-height:240px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.v1 .buy::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,61,41,0) 20%,rgba(20,61,41,.94))}
.v1 .buy>*{position:relative}
.v1 .buy b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.v1 .buy p{font-size:14px;opacity:.85;margin:4px 0 14px;max-width:30ch}
.v1 .tabbar{background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;box-shadow:0 14px 30px -12px rgba(18,32,26,.3);color:#8B948F}
.v1 .tabbar .on{color:var(--pine)}

/* ================= 2 · АВРОРА — Nunito ================= */
.v3{--ink:#221E45;--mute:#625E80;--glass:rgba(255,255,255,.55);--glass-2:rgba(255,255,255,.72);--edge:rgba(255,255,255,.8);--vio:#5B4CE6;
 --sh:0 22px 40px -24px rgba(60,40,140,.35),inset 0 1px 0 rgba(255,255,255,.9);
 color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
 background:linear-gradient(180deg,#2A2468 0px,#5B4CE6 230px,#C98BD0 400px,#FFD3C2 540px,#F6E9F5 760px,#E9EEFB 1300px,#E3F4EE 2200px,#EFEAFB 100%)}
.v3 .glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--edge);border-radius:32px;box-shadow:var(--sh)}
.v3 .sky{position:relative;padding:4px 22px 124px;color:#fff}
.v3 .sky .tp{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.v3 .chipg{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 5px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:800;font-size:14px}
.v3 .chipg .a{width:30px;height:30px;border-radius:50%}
.v3 .rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.v3 .sky h1{font-size:78px;font-weight:900;letter-spacing:-.045em;line-height:.95;margin:26px 0 8px;position:relative;z-index:1}
.v3 .sky p{font-size:15px;font-weight:700;opacity:.9;position:relative;z-index:1}
.v3 .ridge{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;display:block}
.v3 .stack{display:grid;gap:14px;padding:0 14px 22px;margin-top:-100px;position:relative;z-index:2}
.v3 .cam{position:relative;height:280px;border-radius:34px;overflow:hidden;border:5px solid rgba(255,255,255,.6);box-shadow:0 34px 50px -26px rgba(42,36,104,.7)}
.v3 .cam::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(34,30,69,.72))}
.v3 .cam>*{position:absolute;z-index:2}
.v3 .gp{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.5);color:#fff;font-size:12.5px;font-weight:800}
.v3 .dot{width:8px;height:8px;border-radius:50%;background:#FF4D6D;box-shadow:0 0 0 3px rgba(255,77,109,.3)}
.v3 .cam .t{top:14px;left:14px}
.v3 .cam .b{left:16px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:10px}
.v3 .cam .b small{font-size:13px;font-weight:700;opacity:.92;line-height:1.3}
.v3 .btn{height:46px;padding:0 18px;border-radius:999px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.v3 .btn.w{background:#fff;color:var(--ink)}
.v3 .btn.v{background:linear-gradient(135deg,#FF9A7A,#B45CE0 60%,#5B4CE6);color:#fff;box-shadow:0 12px 22px -10px rgba(91,76,230,.7)}
.v3 .stat{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 6px}
.v3 .stat>div{padding:0 12px;border-left:1px solid rgba(98,94,128,.15)}
.v3 .stat>div:first-child{border-left:0}
.v3 .stat svg{color:var(--vio);margin-bottom:10px}
.v3 .stat small{display:block;font-size:12px;font-weight:700;color:var(--mute)}
.v3 .stat b{font-size:17px;font-weight:900}
.v3 .treat{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px}
.v3 .treat .ic{width:54px;height:54px;border-radius:19px;background:linear-gradient(135deg,#FFC2A8,#FF8A7A);display:grid;place-items:center;color:#fff;flex:none}
.v3 .treat b{font-size:16px;font-weight:900;display:block}
.v3 .treat small{font-size:13px;color:var(--mute);font-weight:700}
.v3 .sec{padding:20px}
.v3 h2{font-size:22px;font-weight:900;letter-spacing:-.02em}
.v3 .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.v3 .lk{font-size:14px;font-weight:800;color:var(--vio)}
.v3 .gear{width:132px;flex:none;background:var(--glass-2);border-radius:24px;padding:8px 8px 12px;border:1px solid var(--edge)}
.v3 .gear .im{height:100px;border-radius:18px;display:grid;place-items:center;color:var(--vio);margin-bottom:10px;background:linear-gradient(160deg,#F1EDFF,#FFE9E1)}
.v3 .gear b{display:block;font-size:13px;font-weight:800;line-height:1.25;padding:0 4px}
.v3 .gear small{display:block;font-size:12px;font-weight:700;color:var(--mute);padding:2px 4px 0}
.v3 .lvl{display:flex;align-items:center;gap:14px;padding:12px;border-radius:24px;background:var(--glass-2);border:1px solid var(--edge)}
.v3 .lvl .lv{width:56px;height:56px;border-radius:50%;background:conic-gradient(from 0deg,#FF9A7A,#B45CE0,#5B4CE6 75%,rgba(91,76,230,.12) 0);display:grid;place-items:center;flex:none}
.v3 .lvl .lv b{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;font-weight:900}
.v3 .lvl small{font-size:12.5px;font-weight:700;color:var(--mute)}
.v3 .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 6px;margin-top:20px}
.v3 .ring{text-align:center}
.v3 .ring svg{width:86px;height:86px;display:block;margin:0 auto}
.v3 .ring .v{font:900 21px "Nunito",sans-serif;fill:var(--ink)}
.v3 .ring .u{font:800 10px "Nunito",sans-serif;fill:var(--mute)}
.v3 .ring b{display:block;font-size:12.5px;font-weight:800;margin-top:4px}
.v3 .ring small{font-size:11px;font-weight:700;color:var(--mute)}
.v3 .ring.gold small,.v3 .ring.max small{color:#B86C00}
.v3 .tr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:24px;background:var(--glass-2);border:1px solid var(--edge)}
.v3 .tr+.tr{margin-top:8px}
.v3 .tr .th{width:52px;height:52px;border-radius:18px;flex:none;display:grid;place-items:center;color:var(--vio);background-color:#EEEAFF}
.v3 .tr b{display:block;font-size:15px;font-weight:900}
.v3 .tr small{font-size:12.5px;font-weight:700;color:var(--mute)}
.v3 .tb{height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.v3 .medals{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.v3 .medal{text-align:center;font-size:12px;font-weight:800;color:#9C98B6}
.v3 .medal i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 7px;border-radius:50%;background:rgba(255,255,255,.5);border:1.5px dashed rgba(98,94,128,.25);color:#B5B1CB}
.v3 .medal.on{color:var(--ink)}
.v3 .medal.on i{color:#fff;border:0;background:linear-gradient(140deg,#FFB59A,#B45CE0 55%,#5B4CE6);box-shadow:0 12px 20px -10px rgba(91,76,230,.7),inset 0 0 0 3px rgba(255,255,255,.35)}
.v3 .seg{display:inline-grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.5);border-radius:999px;padding:4px;margin-bottom:12px;border:1px solid var(--edge)}
.v3 .seg button{font-size:13.5px;font-weight:800;padding:8px 16px;border-radius:999px;color:var(--mute)}
.v3 .seg button.on{background:var(--ink);color:#fff}
.v3 .ev .d{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;align-content:center;line-height:1;background-color:#EEEAFF;color:var(--vio);flex:none}
.v3 .ev .d b{font-size:19px;font-weight:900}
.v3 .ev .d small{font-size:11px;font-weight:800;margin-top:3px;color:inherit}
.v3 .ev .d.ph{color:#fff}
.v3 .quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.v3 .q{padding:16px;border-radius:28px;display:flex;flex-direction:column;gap:24px;text-align:left}
.v3 .q svg{color:var(--vio)}

  <p class="hint">Нажмите на характеристику, чтобы начать курс</p>

/* ---------- switching ---------- */
const BG={1:'#EEF1EC',3:'#2A2468'};
function show(v){v=String(v);if(!BG[v])v='1';
 document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!=='v'+v);
 document.querySelectorAll('.sw button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 document.body.style.background=BG[v];document.querySelector('meta[name=theme-color]').content=BG[v];
 try{localStorage.setItem('ksv',v)}catch(e){}
 if(location.hash!=='#v'+v)history.replaceState(null,'','#v'+v);
 window.scrollTo(0,0)}
document.querySelector('.sw').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const w=b.closest('.evw');
 w.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));
 w.querySelectorAll('.evs').forEach(p=>p.hidden=p.dataset.p!==b.dataset.t)});
let start=(location.hash.match(/v([13])/)||[])[1];
if(!start){try{start=localStorage.getItem('ksv')}catch(e){}}
show(start||'1');
let ly=0;addEventListener('scroll',()=>{const y=scrollY;document.querySelector('.sw').classList.toggle('hide',y>ly&&y>80);ly=y},{passive:true});
</script>
